<style>
#inkling-v2{--ik-bg:light-dark(#f8f8f5,#181b19);--ik-paper:light-dark(#fff,#202420);--ik-soft:light-dark(#f0f2ed,#292f29);--ik-text:light-dark(#26332b,#e4eae3);--ik-muted:light-dark(#647166,#a7b4a9);--ik-border:light-dark(#dde3da,#3c473d);--ik-accent:light-dark(#375b45,#b1d2b5);--ik-on:light-dark(#fff,#1b3020);--ik-add:light-dark(#eaf4e7,#293d2c);--ik-del:light-dark(#f9eeea,#402e29);--ik-warning:light-dark(#8a6021,#ebc384);--ik-shadow:light-dark(#17291d20,#0008);--ik-reading:17px;--ik-chat:340px;color-scheme:light dark;color:var(--ik-text);background:var(--ik-paper);font:14px/1.6 'Inter',-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;position:relative;border:1px solid var(--ik-border);border-radius:12px;isolation:isolate;overflow-wrap:anywhere}
#inkling-v2 *{box-sizing:border-box}#inkling-v2 [hidden]{display:none!important}#inkling-v2 button,#inkling-v2 input,#inkling-v2 textarea,#inkling-v2 select{font:inherit;color:inherit}#inkling-v2 button{cursor:var(--cursor-interaction,pointer)}#inkling-v2 button:disabled{opacity:.45;cursor:not-allowed}#inkling-v2 button:focus-visible,#inkling-v2 input:focus-visible,#inkling-v2 textarea:focus-visible,#inkling-v2 select:focus-visible,#inkling-v2 [contenteditable]:focus-visible{outline:2px solid var(--ik-accent);outline-offset:3px}#inkling-v2 button{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--ik-border);background:var(--ik-paper);border-radius:7px;padding:7px 11px;white-space:normal}#inkling-v2 button:hover{background:var(--ik-soft)}#inkling-v2 button.primary{background:var(--ik-accent);color:var(--ik-on);border-color:var(--ik-accent)}#inkling-v2 button.quiet{border-color:transparent;background:transparent;padding:5px 7px}#inkling-v2 button.quiet:hover,#inkling-v2 button.active{background:var(--ik-soft)}#inkling-v2 button.icon{padding:7px;min-width:32px}#inkling-v2 svg{flex-shrink:0}#inkling-v2 input:not([type=checkbox]),#inkling-v2 textarea,#inkling-v2 select{width:100%;border:1px solid var(--ik-border);border-radius:6px;background:var(--ik-paper);padding:9px 10px;min-width:0}#inkling-v2 textarea{resize:vertical}#inkling-v2 h1,#inkling-v2 h2,#inkling-v2 h3,#inkling-v2 p{margin:0}#inkling-v2 h2{font-size:19px;font-weight:600}#inkling-v2 h3{font-size:14px;font-weight:600}#inkling-v2 a{color:var(--ik-accent);text-underline-offset:3px}#inkling-v2 .muted{color:var(--ik-muted);font-size:12px}#inkling-v2 .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}#inkling-v2 .between{justify-content:space-between}#inkling-v2 .stack{display:grid;gap:14px}#inkling-v2 .divider{border-top:1px solid var(--ik-border);padding-top:16px;margin-top:16px}

uted)}#inkling-v2 .block[data-kind=code]{font:13px/1.8 'IBM Plex Mono',ui-monospace,monospace;background:var(--ik-soft);padding:14px;border-radius:6px;overflow-wrap:anywhere}#inkling-v2 .edit-hint{margin-top:25px;display:flex;align-items:center;gap:7px;color:var(--ik-muted);font-size:12px}#inkling-v2 .doc-foot{margin-top:28px;padding-top:14px;border-top:1px solid var(--ik-border);display:flex;justify-content:space-between;gap:10px;color:var(--ik-muted);font-size:12px}
#inkling-v2 .chat{border-left:1px solid var(--ik-border);background:var(--ik-bg);min-width:0;display:flex;flex-direction:column}#inkling-v2 .chat-head{display:flex;align-items:center;justify-content:space-between;padding:14px 15px;gap:5px;border-bottom:1px solid var(--ik-border)}#inkling-v2 .chat-name{font-weight:600;display:flex;align-items:center;gap:7px}#inkling-v2 .chat-content{padding:20px 18px;display:flex;flex-direction:column;gap:22px;flex:1}#inkling-v2 .message{font-size:13px;line-height:1.85;white-space:pre-wrap}#inkling-v2 .message.user{background:var(--ik-soft);padding:12px;border-radius:10px 10px 3px 10px;margin-left:18px}#inkling-v2 .message.assistant .msg-label{font-size:11px;color:var(--ik-muted);margin-bottom:8px;display:flex;gap:7px;align-items:center}#inkling-v2 .message.assistant p{white-space:pre-wrap}#inkling-v2 .message-actions{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap}#inkling-v2 .message-actions button{font-size:12px}#inkling-v2 .suggestion{background:var(--ik-paper);border:1px solid var(--ik-border);border-radius:9px;padding:13px;display:grid;gap:9px}#inkling-v2 .suggestion .old{background:var(--ik-del);padding:8px;color:var(--ik-muted);text-decoration:line-through;font-size:12px;max-height:130px;overflow:auto}#inkling-v2 .suggestion textarea{font-size:13px;background:var(--ik-add);min-height:120px}#inkling-v2 .warning{color:var(--ik-warning);font-size:12px}#inkling-v2 .quick{display:flex;flex-wrap:wrap;gap:7px}#inkling-v2 .quick button{font-size:12px;background:transparent;text-align:left;justify-content:flex-start}#inkling-v2 .composer-wrap{padding:0 15px 16px}#inkling-v2 .context-row{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px}#inkling-v2 .pill{font-size:11px;border:1px solid var(--ik-border);border-radius:5px;padding:3px 6px;display:inline-flex;align-items:center;gap:4px;max-width:100%;overflow-wrap:anywhere}#inkling-v2 .composer{background:var(--ik-paper);border:1px solid var(--ik-border);border-radius:10px;padding:10px}#inkling-v2 .composer textarea{border:0;padding:1px 2px;resize:none;min-height:72px;font-size:13px;background:transparent}#inkling-v2 .composer-bottom{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px}#inkling-v2 .composer-bottom button{font-size:12px}#inkling-v2 .busy{font-size:12px;color:var(--ik-muted);display:flex;align-items:center;gap:7px}#inkling-v2 .footer{padding:9px 15px;border-top:1px solid var(--ik-border);color:var(--ik-muted);font-size:11px;display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap}
#inkling-v2 .overlay{position:absolute;inset:60px 0 36px;z-index:5;background:light-dark(#26332b22,#0007);border-radius:0 0 10px 10px}#inkling-v2 .drawer{background:var(--ik-paper);border:1px solid var(--ik-border);box-shadow:0 12px 45px var(--ik-shadow);border-radius:10px;padding:20px;width:min(420px,calc(100% - 24px));position:relative;margin:12px auto;max-height:none}#inkling-v2 .drawer.wide{width:min(640px,calc(100% - 24px))}#inkling-v2 .drawer-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:20px}#inkling-v2 .drawer-content{display:grid;gap:17px}#inkling-v2 .item{padding:12px 0;border-bottom:1px solid var(--ik-border)}#inkling-v2 .item:first-child{padding-top:0}#inkling-v2 .item:last-child{border-bottom:0}#inkling-v2 .item p{font-size:13px;margin:6px 0;color:var(--ik-muted)}#inkling-v2 .item.active-item{border-left:3px solid var(--ik-accent);padding-left:12px}#inkling-v2 .drawer label{display:grid;gap:6px;font-size:12px}#inkling-v2 .check{display:flex!important;align-items:flex-start;gap:9px!important;font-size:13px!important}#inkling-v2 .check input{margin-top:5px;accent-color:var(--ik-accent)}#inkling-v2 .source-quote{border-left:2px solid var(--ik-border);padding:9px 12px;background:var(--ik-bg);font-size:13px}#inkling-v2 .preview{background:var(--ik-bg);padding:18px;border-radius:7px;display:grid;gap:14px;font-size:13px}#inkling-v2 .preview h2{font-size:21px}#inkling-v2 .notice{color:var(--ik-muted);font-size:12px}#inkling-v2 .diffline{padding:10px;white-space:pre-wrap;font-size:12px;border-radius:5px}#inkling-v2 .diffline.removed{background:var(--ik-del)}#inkling-v2 .diffline.added{background:var(--ik-add)}#inkling-v2 .scroll-panel{max-height:540px;overflow:auto;padding:2px 3px 4px 1px}#inkling-v2 .toast{font-size:12px;color:var(--ik-accent)}
@media(min-width:900px){#inkling-v2 .overlay.left .drawer{margin-left:14px;width:320px}}@media(max-width:800px){#inkling-v2{--ik-chat:300px!important}#inkling-v2 .sheet{padding:28px 25px}#inkling-v2 #ik-title{font-size:25px}#inkling-v2 .doc-location{display:none}#inkling-v2 .chat-content{padding:18px 14px}}@media(max-width:650px){#inkling-v2 .body-grid{grid-template-columns:1fr}#inkling-v2 .sheet{min-height:0;padding:24px}#inkling-v2 .chat{border-left:0;border-top:1px solid var(--ik-border)}#inkling-v2 .chat-content{gap:16px}#inkling-v2 .topbar{padding:10px;gap:7px}#inkling-v2 .brand{font-size:21px}#inkling-v2 .topbar button{font-size:12px}#inkling-v2 .doc-foot{flex-wrap:wrap}#inkling-v2 .overlay{bottom:0}#inkling-v2 .drawer{padding:17px}#inkling-v2 #ik-title{font-size:25px}#inkling-v2 input,#inkling-v2 textarea{font-size:16px}#inkling-v2 .formatbar{justify-content:flex-start}#inkling-v2 .chat-head{padding:13px 18px}}@media(pointer:coarse){#inkling-v2 button{min-height:44px}#inkling-v2 .composer textarea{font-size:16px}}
</style>
<div id="inkling-v2" aria-label="Inkling 正文与 AI 对话工作台"><div style="padding:24px">正在打开写作工作台…</div></div>
<script>
(()=>{
 const root=document.getElementById('inkling-v2');
 const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
 const original='做这个个人项目时，我一开始就列了一张数据库功能对比表。但写到一半，我发现自己还没有回答一个更基本的问题：这个项目实际需要承担什么样的复杂度？';
 const seedBlocks=[{id:'p1',kind:'p',text:original},{id:'p2',kind:'p',text:'我更在意的是：只有一个人维护时，怎样把部署、备份和故障恢复控制在自己能理解的范围里。这也是我想重新审视 SQLite 的原因。'},{id:'h1',kind:'h2',text:'先说明这次选择的边界'},{id:'p3',kind:'p',text:'这里讨论的是一个早期的个人项目。访问方式、写入规模和可靠性目标还需要进一步说明。我希望解释当时的取舍，并留下重新评估的条件。'},{id:'p4',kind:'quote',text:'待补充：这次项目的实际约束，以及一个可能推翻当前选择的反例。'}];
 const seed={schema:2,current:'d1',docs:[{id:'d1',title:'个人项目，真的需要独立数据库吗？',blocks:seedBlocks,rev:3},{id:'d2',title:'一次缓存失效，让我重新理解边界',blocks:[{id:'c1',kind:'p',text:'先记下一个问题：当缓存里的信息不再可信时，我应该在哪里重新检查它？'},{id:'c2',kind:'quote',text:'待整理：事件经过、最初的假设、真正改变判断的证据。'}],rev:1}],messages:[],histories:[],versions:[],sources:[{id:'s1',title:'SQLite 的适用场景',kind:'官方文档 · 演示摘记',url:'https://www.sqlite.org/whentouse.html',text:'围绕应用的访问方式、部署环境和维护要求讨论适用场景。此处为演示摘记，正式使用时保存原文片段。'},{id:'s2',title:'我的部署与维护笔记',kind:'个人笔记 · 示例',url:'',text:'我希望独自完成部署、备份和恢复。需要把这些实际工作纳入选择，而不是只比较功能。'}],attached:['s2'],style:'技术复盘',styleNotes:'先交代实际情境，再说明判断。保留适用条件，用具体经历解释取舍。避免夸张结论和空泛总结。',memories:[{id:'m1',text:'解释技术选择时，先说明项目约束。',kind:'表达偏好'}],notes:[{id:'n1',text:'想写清楚：什么时候值得引入额外的基础设施？'}],published:null};
 let state=structuredClone(seed),panel='',selected=null,proposal=null,prompt='',busy=false,timer=null,saveTimer=null,dirty=false,confirmation=false,compareId=null,lastFocus=null,toast='';
 const design={readingSize:17,chatWidth:340,focus:false};
 const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const icon=name=>`<i data-lucide="${name}" aria-hidden="true"></i>`;
 const btn=(text,action,cls='',attrs='')=>`<button type="button" class="${cls}" data-action="${action}" ${attrs}>${text}</button>`;
 const doc=()=>state.docs.find(d=>d.id===state.current)||state.docs[0];
 function hydrate(saved){if(saved?.schema===2&&Array.isArray(saved.docs)&&saved.docs.length){state={...structuredClone(seed),...saved};state.docs=state.docs.slice(0,5);}}
 hydrate(window.openai?.widgetState?.privateContent?.inklingV2);
 if(!state.versions.length)state.versions=[{id:uid(),doc:doc().id,label:'初始草稿',rev:doc().rev,title:doc().title,blocks:structuredClone(doc().blocks)}];
 let lastSavedSnapshot="";
 function persist(){if(!window.openai?.setWidgetState)return;const saved=structuredClone(state);saved.messages=saved.messages.slice(-5);saved.histories=saved.histories.slice(-2);saved.versions=saved.versions.slice(-3);let payload={modelContent:{product:'Inkling',prototype:'v2',document:doc().title,panel:panel||'editor',style:state.style,revision:doc().rev,proposal:proposal?'pending':null,published:state.published,focus:design.focus},privateContent:{inklingV2:saved}};if(new TextEncoder().encode(JSON.stringify(payload)).byteLength>14000){saved.versions=[];saved.histories=[];}if(new TextEncoder().encode(JSON.stringify(payload)).byteLength<=15000){lastSavedSnapshot=JSON.stringify(saved);window.openai.setWidgetState(payload).catch(()=>{});}}
 function icons(){if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:16,height:16}});}
 function showToast(text){toast=text;const el=root.querySelector('#ik-status');if(el)el.textContent=text;}
 function saveEdit(label='自动恢复点'){if(!dirty)return;clearTimeout(saveTimer);dirty=false;doc().rev++;state.versions.push({id:uid(),doc:doc().id,label,rev:doc().rev,title:doc().title,blocks:structuredClone(doc().blocks)});state.versions=state.versions.slice(-6);confirmation=false;updateMeta();renderChat();persist();}
 function updateMeta(){const save=root.querySelector('#ik-saved');if(save)save.textContent=dirty?'预览内保存中…':'预览内已保存';const meta=root.querySelector('#ik-revision');if(meta)meta.textContent='v'+doc().rev;const count=root.querySelector('#ik-count');if(count)count.textContent=doc().blocks.reduce((n,b)=>n+b.text.length,0)+' 字';}
 function render(){root.innerHTML=`<header class="topbar">${btn(icon('panel-left'),'library','quiet icon','aria-label="打开文章列表"')}<div class="brand">${icon('feather')}Inkling</div><span class="doc-location">个人写作 / 草稿</span><div class="top-spacer"></div>${btn(icon('history')+'版本','versions','quiet')}${btn(icon('fingerprint')+'风格','style','quiet')}${btn(icon('send')+'导出与发布','publish')}</header><div class="body-grid ${design.focus?'focus':''}" id="ik-layout"><main class="document"><div class="formatbar" aria-label="编辑与协作工具">${btn(icon('list-tree')+'大纲','outline','quiet')}${btn(icon('heading-2'),'heading','quiet icon','aria-label="将当前段落设为标题"')}${btn(icon('quote'),'quote','quiet icon','aria-label="将当前段落设为引用"')}${btn(icon('code-xml'),'code','quiet icon','aria-label="将当前段落设为代码"')}<span class="sep"></span>${btn(icon('message-square-plus')+'讨论这一段','select','quiet')}${btn(icon('book-open-check')+'审阅','review','quiet')}${btn(icon(design.focus?'panel-right-open':'panel-right-close'),'focus','quiet icon','aria-label="切换专注写作"')}</div><div class="sheet"><div class="eyebrow"><span class="dot"></span><span id="ik-saved">预览内已保存</span><span>·</span><span id="ik-revision">v${doc().rev}</span></div><textarea id="ik-title" aria-label="文章标题" rows="2" maxlength="110">${esc(doc().title)}</textarea><div class="editor" id="ik-editor">${doc().blocks.map(b=>`<div class="block ${selected?.id===b.id?'chosen':''}" data-block="${esc(b.id)}" data-kind="${esc(b.kind)}" contenteditable="true" role="textbox" aria-label="${b.kind==='h2'?'章节标题':'正文段落'}" aria-multiline="true" spellcheck="false">${esc(b.text)}</div>`).join('')}</div><div class="edit-hint">${btn(icon('plus')+'添加段落','add-block','quiet')}<span>选中文字，与 Inkling 一起推敲</span></div><div class="doc-foot"><span id="ik-count"></span><span>中文 · ${esc(state.style)}</span>${btn(icon('folder-open')+state.attached.length+' 份资料','sources','quiet')}</div></div></main><aside class="chat" id="ik-chat" ${design.focus?'hidden':''} aria-label="Inkling 写作讨论"></aside></div><footer class="footer"><span>交互原型 · AI 回复为示例 · 发布仅模拟</span><span class="toast" id="ik-status" role="status" aria-live="polite">${esc(toast)}</span></footer><div id="ik-overlay" hidden></div>`;renderChat();renderPanel();updateMeta();applyDesign();icons();}
 function applyDesign(){root.style.setProperty('--ik-reading',design.readingSize+'px');root.style.setProperty('--ik-chat',design.chatWidth+'px');root.querySelector('#ik-layout')?.classList.toggle('focus',design.focus);const c=root.querySelector('#ik-chat');if(c)c.hidden=design.focus;}
 function renderChat(){const active=document.activeElement;const editingPrompt=active?.id==='ik-prompt';const caret=editingPrompt?[active.selectionStart,active.selectionEnd]:null;const chat=root.querySelector('#ik-chat');if(!chat)return;const messages=state.messages.length?state.messages:[{role:'assistant',text:'你已经找到一个值得展开的问题：这次技术选择，真正取决于什么？\n\n我会先和你推敲判断与依据。你可以直接编辑正文，也可以选中一段继续讨论。'}];chat.innerHTML=`<div class="chat-head"><span class="chat-name">${icon('sparkles')}Ask Inkling</span><div class="row">${btn(icon('history'),'chat-history','quiet icon','aria-label="查看讨论历史"')}${btn(icon('plus'),'new-chat','quiet icon','aria-label="开始新的讨论"')}</div></div><div class="chat-content">${messages.slice(-4).map((m,i)=>`<div class="message ${m.role}">${m.role==='assistant'?`<div class="msg-label">${icon('feather')}Inkling · 示例回复</div>`:''}<p>${esc(m.text)}</p>${m.role==='assistant'&&state.messages.length?`<div class="message-actions">${btn('存为笔记','save-note','quiet',`data-message="${Math.max(0,state.messages.length-4)+i}"`)}${m.type==='evidence'?btn('查看资料','sources','quiet'):''}${m.type==='outline'?btn('加入章节标题','apply-outline','quiet'):''}${m.type==='review'?btn('查看对应段落','select','quiet'):''}</div>`:''}</div>`).join('')}${proposal?`<div class="suggestion"><div class="row between"><strong>段落修改建议</strong><span class="muted">基于 v${proposal.base}</span></div><div class="old">${esc(proposal.before)}</div><textarea id="ik-proposal" aria-label="可编辑的修改建议">${esc(proposal.after)}</textarea>${proposal.base!==doc().rev?'<div class="warning">正文已更新，请重新生成建议。</div>':'<div class="muted">保留这次选择的情境，明确判断的边界。</div>'}<div class="row">${proposal.base!==doc().rev?btn('重新生成','regenerate','primary'):btn(icon('check')+'接受修改','accept','primary')}${btn('放弃','reject','quiet')}</div></div>`:''}${busy?`<div class="busy" role="status">${icon('ellipsis')}正在准备示例回复… ${btn('停止','stop','quiet')}</div>`:''}<div class="quick">${btn('梳理核心判断','clarify')}${btn('查找依据','evidence')}${btn('改写这一段','rewrite')}</div></div><div class="composer-wrap"><div class="context-row"><span class="pill">${icon('file-text')}当前文章</span>${selected?btn('选中段落 ×','clear-selection','pill'):''}${btn(icon('paperclip')+state.attached.length+' 份资料','sources','pill')}</div><form class="composer" id="ik-composer"><textarea id="ik-prompt" aria-label="和 Inkling 讨论" rows="3" placeholder="这段判断站得住脚吗？" maxlength="1200">${esc(prompt)}</textarea><div class="composer-bottom">${btn(icon('fingerprint')+esc(state.style),'style','quiet')}<button type="submit" class="primary icon" aria-label="发送消息" ${busy?'disabled':''}>${icon('arrow-up')}</button></div></form></div>`;icons();if(editingPrompt){const next=root.querySelector('#ik-prompt');next.focus();next.setSelectionRange(...caret);}}
 function captureSelection(){const sel=window.getSelection();if(!sel||!sel.toString().trim()||!sel.anchorNode)return;const parent=sel.anchorNode.nodeType===1?sel.anchorNode:sel.anchorNode.parentElement;const block=parent.closest?.('[data-block]');if(!block||!root.contains(block))return;selected={id:block.dataset.block,text:sel.toString().trim().slice(0,500)};root.querySelectorAll('[data-block]').forEach(e=>e.classList.toggle('chosen',e.dataset.block===selected.id));renderChat();}
 function pickBlock(){const block=doc().blocks.find(b=>b.id===selected?.id)||doc().blocks.find(b=>b.kind==='p')||doc().blocks[0];if(block){selected={id:block.id,text:block.text};root.querySelectorAll('[data-block]').forEach(e=>e.classList.toggle('chosen',e.dataset.block===block.id));}return block;}
 function makeProposal(){const b=pickBlock();if(!b)return;proposal={id:b.id,doc:doc().id,base:doc().rev,before:b.text,after:b.text===original?'为这个个人项目选数据库时，我先比较了功能，后来才意识到：我需要先说明项目的实际约束，才能判断哪些复杂度值得承担。':b.text+'\n\n这个判断适用于怎样的场景，还需要结合具体约束进一步说明。'};}
 function ask(text,type){saveEdit();if(busy)return;const request=text.trim();if(!request)return;prompt='';state.messages.push({role:'user',text:request});busy=true;renderChat();timer=setTimeout(()=>{busy=false;let answer='';if(type==='rewrite'){makeProposal();answer='我准备了一版候选表达。你可以直接修改建议，再决定是否写入正文。';}else if(type==='evidence'){answer='可以先核对两类依据：\n\n1. 官方材料能支持哪些适用条件？\n2. 你的实际部署、备份和恢复经历说明了什么？\n\n已在示例资料中列出对应入口。个人经历仍需要你补充。';state.attached=Array.from(new Set([...state.attached,'s1']));}else if(type==='outline'){answer='可以按读者理解判断的顺序展开：\n\n• 当时要解决什么问题\n• 哪些约束影响了选择\n• 我比较了什么、放弃了什么\n• 什么变化会让我重新选择';}else if(type==='review'){answer='有一个值得先处理的缺口：\n\n“独自维护”和“选择 SQLite”之间，还缺少具体的工作量或经历。可以补一段实际观察，或把结论保留为当前假设。\n\n这条建议属于论证检查，你可以保留原文。';pickBlock();}else{answer='先把核心判断收窄到这次经历：你是如何判断额外复杂度是否值得的？\n\n你提到的“'+request.slice(0,60)+'”可以从一个具体事件展开。\n\n当时哪项约束真正改变了你的选择？';}state.messages.push({role:'assistant',text:answer,type});state.messages=state.messages.slice(-6);renderChat();persist();},450);}
 function stop(){clearTimeout(timer);busy=false;state.messages.push({role:'assistant',text:'已停止这次示例回复，讨论和正文已保留。'});renderChat();persist();}
 function openPanel(name){saveEdit();lastFocus=document.activeElement;panel=name;confirmation=false;compareId=null;renderPanel();persist();}
 function closePanel(){panel='';renderPanel();lastFocus?.isConnected&&lastFocus.focus();persist();}
 function markdown(){return '# '+doc().title+'\n\n'+doc().blocks.map(b=>b.kind==='h2'?'## '+b.text:b.kind==='quote'?'> '+b.text:b.kind==='code'?'```\n'+b.text+'\n```':b.text).join('\n\n');}
 function renderPanel(){const host=root.querySelector('#ik-overlay');if(!host)return;if(!panel){host.hidden=true;host.innerHTML='';return;}host.hidden=false;host.className='overlay '+(['library','sources','outline','ideas'].includes(panel)?'left':'');let title='',body='';
 if(panel==='library'){title='我的文章';body=`<div class="row">${btn(icon('plus')+'新建文章','new-doc','primary')}${btn('灵感笔记','ideas')}</div>${state.docs.map(d=>`<div class="item ${d.id===state.current?'active-item':''}"><h3>${esc(d.title||'未命名文章')}</h3><p>草稿 · v${d.rev}</p>${btn('打开文章','open-doc','quiet',`data-id="${d.id}"`)}</div>`).join('')}`;}
 if(panel==='sources'){title='文章资料';body=state.sources.map(s=>`<div class="item"><label class="check"><input type="checkbox" data-source="${s.id}" ${state.attached.includes(s.id)?'checked':''}><span><strong>${esc(s.title)}</strong><br><span class="muted">${esc(s.kind)}</span></span></label><p>${esc(s.text)}</p>${s.url?`<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer" class="muted">打开来源 ↗</a>`:''}</div>`).join('')+`<details><summary>添加一份资料</summary><form id="ik-source-form" class="stack" style="margin-top:12px"><label>资料标题<input name="title" required maxlength="100" placeholder="比如：这次项目的部署记录"></label><label>原文或笔记<textarea name="text" required maxlength="1000" rows="3"></textarea></label><label>来源 URL（可选）<input name="url" type="url" placeholder="https://"></label><button class="primary" type="submit">保存并加入上下文</button></form></details>`;}
 if(panel==='outline'){title='文章大纲';body=`<p class="notice">点击章节返回正文。也可以和 Inkling 讨论结构。</p>${doc().blocks.filter(b=>b.kind==='h2').map(b=>`<div class="item">${btn(esc(b.text),'jump','quiet',`data-id="${b.id}"`)}</div>`).join('')||'<p>还没有章节标题。</p>'}${btn(icon('sparkles')+'一起整理结构','outline-chat','primary')}`;}
 if(panel==='style'){title='风格与个人记忆';body=`<label>本篇文章的风格<select id="ik-style"><option ${state.style==='技术复盘'?'selected':''}>技术复盘</option><option ${state.style==='技术教程'?'selected':''}>技术教程</option><option ${state.style==='观点文章'?'selected':''}>观点文章</option></select></label><label>表达偏好<textarea id="ik-style-notes" rows="4" maxlength="800">${esc(state.styleNotes)}</textarea></label>${btn('保存风格设置','save-style','primary')}<div class="divider"><h3>已确认的个人记忆</h3>${state.memories.map(m=>`<div class="item"><span class="muted">${esc(m.kind)}</span><p>${esc(m.text)}</p>${btn('撤回','forget','quiet',`data-id="${m.id}"`)}</div>`).join('')||'<p class="notice">尚未保存个人记忆。</p>'}</div><div class="source-quote">候选经验：把部署、备份和恢复成本纳入个人项目的技术选型。</div>${btn('确认保存这条经验','remember')}`;}
 if(panel==='versions'){title='版本历史';const versions=state.versions.filter(v=>v.doc===doc().id);body=`<div class="row"><span class="muted">当前 v${doc().rev}</span>${btn(icon('bookmark')+'保存快照','name-version')}</div>${versions.slice().reverse().map(v=>`<div class="item"><h3>${esc(v.label)}</h3><p>v${v.rev} · ${esc(v.title)}</p><div class="row">${btn('比较','compare','quiet',`data-id="${v.id}"`)}${btn('恢复内容','restore','quiet',`data-id="${v.id}"`)}</div></div>`).join('')}<div id="ik-diff"></div>`;}
 if(panel==='chat-history'){title='讨论历史';body=`${state.histories.length?state.histories.slice().reverse().map(h=>`<div class="item"><h3>${esc(h.title)}</h3><p>${h.messages.length} 条消息</p>${btn('打开讨论','load-chat','quiet',`data-id="${h.id}"`)}</div>`).join(''):'<p class="notice">当前是这篇文章的第一段讨论。点击 Chat 顶部的加号可开始新讨论。</p>'}`;}
 if(panel==='ideas'){title='灵感与笔记';body=`<form id="ik-note-form" class="stack"><label>记下一点想法<textarea name="note" required rows="3" maxlength="800" placeholder="一个疑问，或一段想保留的话"></textarea></label><button type="submit" class="primary">保存笔记</button></form>${state.notes.slice().reverse().map(n=>`<div class="item"><p>${esc(n.text)}</p>${btn('插入正文','insert-note','quiet',`data-id="${n.id}"`)}</div>`).join('')}`;}
 if(panel==='publish'){title='导出与发布';const old=state.published?.doc===doc().id?state.published:null;body=`<div class="row between"><span class="pill">${icon('file-check')}当前版本 v${doc().rev}</span><span class="muted">个人博客 · 示例连接</span></div><div class="preview"><h2>${esc(doc().title)}</h2><p>${esc(doc().blocks.find(b=>b.kind==='p')?.text||'暂无正文')}</p><span class="muted">预览当前已保存版本</span></div><div class="row">${btn(icon('file-code')+'查看 Markdown','export')}${btn(icon('file-plus')+'模拟创建草稿','draft')}</div>${old?`<div class="source-quote">${old.kind==='draft'?'已模拟创建草稿':'已模拟发布'} v${old.rev}${old.rev!==doc().rev?' · 本地有新修改':''}<br><span class="muted">未向外部平台发送内容</span></div>`:''}<label class="check"><input id="ik-publish-confirm" type="checkbox"><span>我已检查当前 v${doc().rev}，确认演示发布这个版本。</span></label>${btn(icon('send')+(old?.kind==='published'?'模拟更新文章':'模拟发布文章'),'publish-now','primary','disabled id="ik-publish-button"')}<p class="notice">此原型未连接账号，发布操作仅展示确认与状态变化。</p>`;}
 if(panel==='export'){title='Markdown 导出';body=`<label>当前文章<textarea id="ik-markdown" readonly rows="15">${esc(markdown())}</textarea></label><div class="row">${btn(icon('copy')+'复制内容','copy','primary')}${btn('返回发布预览','publish')}</div>`;}
 host.innerHTML=`<section class="drawer ${panel==='publish'||panel==='export'?'wide':''}" role="dialog" aria-label="${esc(title)}"><div class="drawer-head"><h2>${title}</h2>${btn(icon('x'),'close','quiet icon','aria-label="关闭面板"')}</div><div class="drawer-content scroll-panel">${body}</div></section>`;icons();host.querySelector('[data-action="close"]')?.focus();}
 root.addEventListener('mouseup',captureSelection);
 root.addEventListener('keyup',e=>{if(e.target.closest?.('[data-block]'))captureSelection();});
 root.addEventListener('focusin',e=>{if(e.target.dataset.block)root.dataset.activeBlock=e.target.dataset.block;});
 root.addEventListener('input',e=>{const el=e.target;if(el.id==='ik-prompt'){prompt=el.value;return;}if(el.id==='ik-proposal'&&proposal){proposal.after=el.value;return;}if(el.id==='ik-title'||el.dataset.block){if(el.id==='ik-title')doc().title=el.value;else{const b=doc().blocks.find(b=>b.id===el.dataset.block);if(b)b.text=el.innerText.slice(0,6000);}dirty=true;confirmation=false;updateMeta();clearTimeout(saveTimer);saveTimer=setTimeout(()=>saveEdit(),700);}});
 root.addEventListener('change',e=>{if(e.target.dataset.source){const id=e.target.dataset.source;state.attached=e.target.checked?Array.from(new Set([...state.attached,id])):state.attached.filter(x=>x!==id);renderChat();persist();}if(e.target.id==='ik-publish-confirm'){confirmation=e.target.checked;root.querySelector('#ik-publish-button').disabled=!confirmation;}});
 root.addEventListener('paste',e=>{if(e.target.closest?.('[contenteditable]')){e.preventDefault();document.execCommand('insertText',false,e.clipboardData.getData('text/plain'));}});
 root.addEventListener('keydown',e=>{if(e.key==='Escape'&&panel){e.preventDefault();closePanel();}if(e.target.id==='ik-prompt'&&e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();root.querySelector('#ik-composer').requestSubmit();}});
 root.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='ik-composer'){const t=prompt;const type=/依据|来源|研究|资料/.test(t)?'evidence':/大纲|结构/.test(t)?'outline':/改写|润色|精简/.test(t)?'rewrite':/检查|审阅|反例/.test(t)?'review':'clarify';ask(t,type);}if(e.target.id==='ik-source-form'){const data=new FormData(e.target),url=String(data.get('url')||'');if(url&&!/^https?:\/\//i.test(url)){showToast('来源链接仅支持 http 或 https');return;}const id=uid();state.sources.push({id,title:String(data.get('title')),text:String(data.get('text')),url,kind:'手工添加'});state.attached.push(id);renderPanel();renderChat();persist();showToast('资料已加入当前上下文');}if(e.target.id==='ik-note-form'){const data=new FormData(e.target);state.notes.push({id:uid(),text:String(data.get('note'))});renderPanel();persist();showToast('笔记已保存在预览中');}});
 root.addEventListener('click',async e=>{if(e.target.id==='ik-overlay'){closePanel();return;}const el=e.target.closest('[data-action]');if(!el)return;const action=el.dataset.action;const id=el.dataset.id;
 if(['library','sources','outline','style','versions','publish','export','chat-history','ideas'].includes(action)){openPanel(action);return;}
 if(action==='close'){closePanel();return;}if(action==='focus'){design.focus=!design.focus;render();persist();return;}
 if(action==='select'){saveEdit();pickBlock();design.focus=false;render();root.querySelector('#ik-prompt')?.focus();showToast('当前段落已加入讨论上下文');persist();return;}
 if(action==='clear-selection'){selected=null;root.querySelectorAll('[data-block]').forEach(x=>x.classList.remove('chosen'));renderChat();return;}
 if(['clarify','evidence','rewrite','review'].includes(action)){ask({clarify:'帮我梳理这篇文章的核心判断',evidence:'帮我找出这个判断需要的依据',rewrite:'保留原意，让这一段更清楚',review:'检查这篇文章的论证缺口'}[action],action);return;}
 if(action==='stop'){stop();return;}
 if(action==='regenerate'){saveEdit();makeProposal();renderChat();return;}
 if(action==='reject'){proposal=null;renderChat();showToast('已放弃建议，继续讨论');persist();return;}
 if(action==='accept'){saveEdit();const b=doc().blocks.find(x=>x.id===proposal?.id);if(!proposal||proposal.doc!==doc().id||proposal.base!==doc().rev||b?.text!==proposal.before){renderChat();showToast('正文已变化，请重新生成建议');return;}b.text=proposal.after;proposal=null;selected=null;dirty=true;saveEdit('接受 AI 修改');render();showToast('修改已写入正文，可在版本中比较');return;}
 if(action==='add-block'){const b={id:uid(),kind:'p',text:''};doc().blocks.push(b);dirty=true;saveEdit('新增段落');render();root.querySelector(`[data-block="${b.id}"]`).focus();return;}
 if(['heading','quote','code'].includes(action)){const b=doc().blocks.find(x=>x.id===root.dataset.activeBlock)||pickBlock();if(b){b.kind={heading:'h2',quote:'quote',code:'code'}[action];dirty=true;saveEdit('调整段落格式');render();}return;}
 if(action==='new-chat'){if(busy)stop();if(state.messages.length)state.histories.push({id:uid(),doc:doc().id,title:state.messages.find(m=>m.role==='user')?.text.slice(0,35)||'文章讨论',messages:structuredClone(state.messages)});state.messages=[];proposal=null;renderChat();persist();showToast('已开始新讨论，文章上下文继续可用');return;}
 if(action==='load-chat'){const h=state.histories.find(x=>x.id===id);if(h){if(busy)stop();if(state.messages.length)state.histories.push({id:uid(),doc:doc().id,title:'刚才的讨论',messages:structuredClone(state.messages)});state.messages=structuredClone(h.messages);state.current=h.doc;proposal=null;selected=null;panel='';render();persist();}return;}
 if(action==='open-doc'||action==='new-doc'){saveEdit();if(busy)stop();if(state.messages.length)state.histories.push({id:uid(),doc:doc().id,title:doc().title,messages:structuredClone(state.messages)});if(action==='new-doc'){const d={id:uid(),title:'未命名文章',blocks:[{id:uid(),kind:'p',text:'从一个问题、一段经历，或一个还没想清楚的判断开始。'}],rev:1};state.docs.push(d);state.current=d.id;}else state.current=id;selected=null;proposal=null;state.messages=[];panel='';render();persist();return;}
 if(action==='jump'){panel='';renderPanel();root.querySelector(`[data-block="${id}"]`)?.focus();return;}
 if(action==='outline-chat'){closePanel();ask('一起整理这篇文章的结构','outline');return;}
 if(action==='apply-outline'){const text='什么变化会让我重新选择';if(!doc().blocks.some(b=>b.text===text)){doc().blocks.push({id:uid(),kind:'h2',text},{id:uid(),kind:'p',text:'待补充：哪些需求或约束变化，会让我重新评估当前方案？'});dirty=true;saveEdit('补充文章结构');render();}showToast('已将反例与重新评估条件加入正文');return;}
 if(action==='save-note'){const msg=state.messages[Number(el.dataset.message)];if(msg){state.notes.push({id:uid(),text:msg.text});persist();showToast('已保存到灵感与笔记');}return;}
 if(action==='insert-note'){const note=state.notes.find(n=>n.id===id);if(note){doc().blocks.push({id:uid(),kind:'p',text:note.text});dirty=true;saveEdit('插入笔记');panel='';render();persist();}return;}
 if(action==='save-style'){state.style=root.querySelector('#ik-style').value;state.styleNotes=root.querySelector('#ik-style-notes').value;panel='';render();persist();showToast('本篇风格已更新');return;}
 if(action==='remember'){if(!state.memories.some(x=>x.id==='practice'))state.memories.push({id:'practice',kind:'个人经验 · 已确认',text:'把部署、备份和恢复成本纳入个人项目的技术选型。'});renderPanel();persist();showToast('已保存这条经验，可随时撤回');return;}
 if(action==='forget'){state.memories=state.memories.filter(m=>m.id!==id);renderPanel();persist();showToast('已撤回这条记忆');return;}
 if(action==='name-version'){saveEdit();state.versions.push({id:uid(),doc:doc().id,label:'手动保存 · '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}),rev:doc().rev,title:doc().title,blocks:structuredClone(doc().blocks)});state.versions=state.versions.slice(-6);renderPanel();persist();return;}
 if(action==='compare'){const v=state.versions.find(x=>x.id===id);if(v){const changes=[];const ids=Array.from(new Set([...v.blocks,...doc().blocks].map(b=>b.id)));for(const bid of ids){const old=v.blocks.find(b=>b.id===bid),now=doc().blocks.find(b=>b.id===bid);if(old?.text!==now?.text||old?.kind!==now?.kind)changes.push((old?`<div class="diffline removed">旧版：${esc(old.text)}</div>`:'')+(now?`<div class="diffline added">当前：${esc(now.text)}</div>`:''));}if(v.title!==doc().title)changes.unshift(`<p>标题由“${esc(v.title)}”改为“${esc(doc().title)}”。</p>`);root.querySelector('#ik-diff').innerHTML=`<div class="stack"><h3>v${v.rev} 与当前版本比较</h3>${changes.join('')||'<p class="notice">内容相同。</p>'}</div>`;}return;}
 if(action==='restore'){const v=state.versions.find(x=>x.id===id);if(v){doc().title=v.title;doc().blocks=structuredClone(v.blocks);proposal=null;selected=null;dirty=true;saveEdit('恢复自 v'+v.rev);panel='';render();persist();showToast('已恢复内容并创建新版本');}return;}
 if(action==='draft'){state.published={doc:doc().id,rev:doc().rev,kind:'draft',simulated:true};confirmation=false;renderPanel();persist();showToast('已模拟创建草稿，未连接外部平台');return;}
 if(action==='publish-now'){if(!confirmation)return;state.published={doc:doc().id,rev:doc().rev,kind:'published',simulated:true};confirmation=false;renderPanel();persist();showToast('模拟发布完成，未向外部发送内容');return;}
 if(action==='copy'){const field=root.querySelector('#ik-markdown');field.select();try{await navigator.clipboard.writeText(field.value);showToast('Markdown 已复制');}catch{showToast('内容已选中，可按 ⌘C 复制');}return;}
 });
 window.addEventListener('openai:set_globals',e=>{const saved=e.detail?.globals?.widgetState?.privateContent?.inklingV2;if(saved?.schema===2&&JSON.stringify(saved)!==lastSavedSnapshot){if(busy){clearTimeout(timer);busy=false;}clearTimeout(saveTimer);dirty=false;hydrate(saved);proposal=null;selected=null;render();}});
 render();
 if(globalThis.Tweak){const tweak=new globalThis.Tweak({container:root,onChange:()=>{applyDesign();persist();}});tweak.addSlider(design,'readingSize',{label:'正文字号',min:15,max:20,unit:'px'});tweak.addSlider(design,'chatWidth',{label:'Chat 宽度',min:300,max:400,unit:'px'});tweak.addToggle(design,'focus',{label:'专注写作'});}
})();
</script>
