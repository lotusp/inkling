<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Inkling · 写作台</title>
    <style>
      :root {
        --ink: #242e27;
        --muted: #606d62;
        --line: #dde2d8;
        --green: #345c48;
        --wash: #eef2ea;
        --paper: #fffefa;
        --serif: 'Songti SC', 'Noto Serif CJK SC', 'STSong', Georgia, serif;
        --ui:
          -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei',
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        color: var(--ink);
        background: var(--paper);
        font: 14px/1.6 var(--ui);
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
        border: 0;
        background: transparent;
        border-radius: 6px;
        padding: 5px 9px;
      }
      button:hover {
        background: var(--wash);
      }
      button:disabled {
        opacity: 0.44;
        cursor: default;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      textarea:focus-visible,
      [contenteditable]:focus-visible,
      select:focus-visible {
        outline: 2px solid #789982;
        outline-offset: 2px;
      }
      input,
      textarea,
      select {
        max-width: 100%;
        accent-color: var(--green);
      }
      [hidden] {
        display: none !important;
      }
      .row,
      header,
      .actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .grow {
        flex: 1;
      }
      .muted,
      small {
        color: var(--muted);
      }
      .icon {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.65;
        stroke-linecap: round;
        stroke-linejoin: round;
        vertical-align: -3px;
      }
      .ib {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 32px;
        min-height: 32px;
      }
      .with {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .primary {
        background: var(--green);
        color: white;
      }
      .primary:hover {
        background: #264937;
      }
      .quiet {
        color: var(--muted);
      }
      .lined {
        border: 1px solid var(--line);
      }
      .active,
      .pill {
        background: var(--wash);
        color: var(--green);
      }
      .pill {
        border-radius: 6px;
        padding: 2px 7px;
        font-size: 12px;
      }
      .actions {
        flex-wrap: wrap;
      }
      .wordmark {
        width: 112px;
        height: 32px;
        flex: none;
        object-fit: contain;
      }
      .top {
        height: 56px;
        padding: 0 clamp(12px, 2.2vw, 36px);
        border-bottom: 1px solid var(--line);
        background: #fdfdf9;
        gap: 12px;
      }
      .top .divider {
        height: 17px;
        border-left: 1px solid var(--line);
      }
      .top button {
        font-size: 13px;
      }
      .dot {
        display: inline-block;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #63846d;
      }
      .dot.pending {
        background: #a47635;
      }
      .layout {
        height: calc(100dvh - 56px);
        display: flex;
      }
      #libraryRail {
        width: clamp(240px, 21vw, 306px);
        flex: none;
        min-width: 0;
        overflow: auto;
        border-right: 1px solid var(--line);
        background: #f8f9f4;
      }
      #libraryRail > header,
      .rail-head {
        height: 56px;
        padding: 0 16px;
        border-bottom: 1px solid var(--line);
      }
      #libraryRail > header {
        position: sticky;
        top: 0;
        background: #f8f9f4;
        z-index: 1;
      }
      #libraryRail h2 {
        font-size: 15px;
        margin: 0;
      }
      #rightRail {
        width: clamp(320px, 31vw, 465px);
        flex: none;
      }
      #rightDetail {
        overflow: auto;
        min-height: 0;
      }
      .rail-head [aria-pressed='true'],
      .top [aria-expanded='true'] {
        color: var(--green);
        background: var(--wash);
      }
      .rail-head button {
        font-size: 13px;
      }

      main {
        flex: 1;
        min-width: 0;
        overflow: auto;
        scrollbar-gutter: stable;
      }
      .sheet {
        width: min(100% - 80px, 690px);
        margin: clamp(42px, 8vh, 96px) auto 25vh;
      }
      .crumb {
        color: var(--muted);
        font-size: 12px;
        display: flex;
        gap: 11px;
        align-items: center;
      }
      .crumb i {
        display: block;
        width: 22px;
        height: 1px;
        background: #879a86;
      }
      h1 {
        font: 600 clamp(29px, 3vw, 44px)/1.35 var(--serif);
        letter-spacing: -0.045em;
        margin: 19px 0 36px;
        overflow-wrap: anywhere;
      }
      h1:empty:before {
        content: '文章标题';
        color: var(--muted);
      }
      .block {
        position: relative;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font: 18px/1.98 var(--serif);
        margin: 0 0 19px;
        min-height: 1.9em;
      }
      .block:focus,
      h1:focus {
        outline: none;
      }
      .block.h2 {
        font-size: 24px;
        line-height: 1.5;
        font-weight: 650;
        margin: 36px 0 15px;
      }
      .block.quote {
        color: var(--green);
        border-left: 2px solid #78917b;
        padding: 2px 0 2px 18px;
        margin: 26px 0;
      }
      .block.ul {
        padding-left: 1.2em;
      }
      .block.ul:before {
        content: '•';
        position: absolute;
        left: 0.2em;
        color: var(--green);
      }
      .block.strong {
        font-weight: 700;
      }
      .block.marked:after {
        content: '';
        position: absolute;
        left: -13px;
        top: 0.4em;
        bottom: 0.4em;
        border-left: 2px solid #78917b;
      }
      .endmark {
        color: #728576;
        font-size: 12px;
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 35px;
      }
      .endmark:before {
        content: '';
        width: 34px;
        border-top: 1px solid var(--line);
      }
      aside {
        min-width: 0;
        display: flex;
        flex-direction: column;
        border-left: 1px solid var(--line);
        background: #f4f6f0;
      }

      .thread {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 25px clamp(16px, 2vw, 30px);
      }
      .msg {
        margin-bottom: 24px;
      }
      .by {
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: var(--green);
        margin-bottom: 7px;
      }
      .msg p {
        margin: 0;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .msg.user {
        margin-left: 20px;
        background: #e6ebe1;
        padding: 12px 15px;
        border-radius: 10px;
      }
      .msg.user .by {
        color: var(--muted);
      }
      .msg button,
      .card button {
        font-size: 12px;
      }
      .text-btn {
        color: var(--green);
        padding: 3px 0;
        margin-right: 11px;
      }
      .cite {
        border-left: 2px solid #97aa94;
        color: var(--muted);
        padding: 2px 9px !important;
        margin-top: 10px !important;
      }
      .compose {
        padding: 12px clamp(12px, 1.55vw, 24px) 18px;
      }
      .quick {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
        margin-bottom: 9px;
      }
      .quick button {
        border: 1px solid #d7ded1;
        color: #4d6353;
        font-size: 12px;
        padding: 3px 8px;
      }
      .composer {
        background: #fffefa;
        border: 1px solid #cbd4c6;
        border-radius: 10px;
        padding: 10px 12px;
      }
      .composer textarea {
        width: 100%;
        resize: vertical;
        min-height: 46px;
        max-height: 120px;
        border: 0;
        background: transparent;
        margin: 7px 0 0;
      }
      .composer textarea:focus {
        outline: none;
      }
      .composer:focus-within {
        border-color: #759078;
      }
      .context {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
      }
      .context button,
      .composer small {
        font-size: 11px;
      }
      .send {
        background: var(--green);
        color: #fff;
        width: 30px;
        height: 30px;
        padding: 0;
      }
      .send:hover {
        background: #254330;
      }
      .card {
        border: 1px solid #cdd8c8;
        border-radius: 10px;
        background: var(--paper);
        padding: 13px;
        margin: 12px 0;
      }
      .card strong,
      .card small {
        display: block;
      }
      .card del {
        display: block;
        color: var(--muted);
        margin: 8px 0;
        font-size: 13px;
      }
      .card textarea {
        width: 100%;
        min-height: 100px;
        resize: vertical;
      }
      .card .actions {
        margin-top: 9px;
      }
      .warn {
        color: #865f27;
      }
      .tool {
        position: fixed;
        z-index: 3;
        background: var(--ink);
        color: white;
        border-radius: 7px;
        box-shadow: 0 4px 20px #15251a25;
        padding: 3px;
        display: flex;
        max-width: calc(100vw - 12px);
        gap: 1px;
      }
      .tool button {
        font-size: 12px;
        color: white;
        padding: 5px 7px;
      }
      .tool button:hover {
        background: #435549;
      }
      dialog {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 0;
        color: var(--ink);
        background: var(--paper);
        width: min(460px, calc(100% - 28px));
        max-height: 84dvh;
        box-shadow: 0 20px 80px #1c2b1f24;
      }
      dialog::backdrop {
        background: #26312338;
      }
      dialog header {
        position: sticky;
        top: 0;
        background: var(--paper);
        z-index: 1;
        padding: 14px 18px;
        border-bottom: 1px solid var(--line);
      }
      dialog h2 {
        font: 600 20px var(--serif);
        margin: 0;
      }
      .inside {
        padding: 18px;
      }
      .inside h3 {
        font-size: 14px;
        margin: 18px 0 6px;
      }
      .inside input:not([type='checkbox']),
      .inside textarea,
      .inside select,
      .card textarea {
        padding: 7px 9px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: white;
      }
      .inside input:not([type='checkbox']),
      .inside textarea {
        width: 100%;
      }
      .inside textarea {
        min-height: 85px;
      }
      .inside label {
        display: block;
        margin: 10px 0 5px;
      }
      .revision-diff {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        line-height: 1.85;
      }
      .revision-diff ins {
        background: #dcefe0;
        color: #224d30;
      }
      .revision-diff del {
        display: inline;
        margin: 0;
        font: inherit;
        background: #f5e1dc;
        color: #793a2d;
      }
      #versionQuery {
        width: 100%;
        margin-bottom: 8px;
      }
      .version-tools,
      .version-row {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .version-tools {
        justify-content: space-between;
        margin-bottom: 16px;
      }
      .version-row > div:first-child {
        min-width: 0;
        flex: 1;
        overflow-wrap: anywhere;
      }
      .version-row strong {
        font:
          600 13px ui-monospace,
          monospace;
        display: block;
      }
      .version-row small {
        color: var(--muted);
      }
      .version-more {
        position: relative;
      }
      .version-more summary {
        list-style: none;
        cursor: pointer;
        padding: 5px 8px;
        font-weight: 700;
      }
      .version-more summary::-webkit-details-marker {
        display: none;
      }
      .version-more[open] div {
        position: absolute;
        right: 0;
        z-index: 2;
        background: var(--paper, #fff);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 4px;
        min-width: 74px;
      }
      .diff-line {
        display: grid;
        grid-template-columns: 1.1em 1fr;
        gap: 3px;
        padding: 3px 6px;
      }
      .diff-line.removed {
        background: #fbefeb;
        color: #74372e;
      }
      .diff-line.added {
        background: #eaf4ea;
        color: #214d34;
      }
      .revision-picks select {
        width: 100%;
      }
      #libraryRail {
        display: flex;
        flex-direction: column;
      }
      #libraryRail > header {
        flex: none;
      }
      #libraryBody {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 14px 12px;
      }
      #libraryMaterials {
        flex: none;
        display: flex;
        gap: 12px;
        border-top: 1px solid var(--line);
        margin: 0 16px;
        padding: 12px 0;
      }
      #libraryMaterials button,
      .library-scope button {
        color: var(--muted);
        font-size: 12px;
      }
      #libraryMaterials button {
        padding: 4px 2px;
      }
      .library-scope {
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 0 4px 9px;
      }
      .library-scope strong {
        font-size: 13px;
        overflow-wrap: anywhere;
      }
      .library-scope small {
        white-space: nowrap;
      }
      .article-row {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 4px 5px 4px 9px;
        border-left: 2px solid transparent;
        border-radius: 4px;
      }
      .article-row + .article-row {
        margin-top: 3px;
      }
      .article-row.current {
        background: var(--wash);
        border-left-color: var(--green);
      }
      .article-name {
        display: block;
        background: none;
        padding: 5px 0;
        text-align: left;
        line-height: 1.5;
        width: 100%;
        overflow-wrap: anywhere;
      }
      .article-row > div:first-child {
        flex: 1;
        min-width: 0;
      }
      .article-row small:not(:empty) {
        display: block;
        padding-bottom: 4px;
        font-size: 11px;
      }
      .article-more {
        align-self: center;
        color: var(--muted);
        letter-spacing: 1px;
        min-width: 30px;
        min-height: 32px;
      }
      .library-popup {
        position: fixed;
        inset: auto;
        margin: 0;
        padding: 5px;
        background: #fffefb;
        color: inherit;
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: 0 6px 22px #24392c1e;
        max-width: calc(100vw - 16px);
        max-height: 70dvh;
        overflow: auto;
      }
      .library-popup button {
        display: block;
        width: 100%;
        text-align: left;
        padding: 7px 12px;
      }
      .library-popup .lined {
        border: 0;
      }
      .library-popup .trash-action {
        border-top: 1px solid var(--line);
        border-radius: 0;
        color: #83473b;
        margin-top: 3px;
      }
      .library-filter {
        width: 210px;
        padding: 10px 14px;
      }
      .library-filter label:first-child {
        margin-top: 0;
      }
      .library-filter select {
        width: 100%;
      }
      .library-filter button {
        margin-top: 12px;
        text-align: center;
      }
      .item {
        padding: 13px 0;
        border-bottom: 1px solid var(--line);
        overflow-wrap: anywhere;
      }
      .item p {
        margin: 3px 0;
      }
      .item .row button:first-child {
        text-align: left;
      }
      .item details {
        margin-top: 4px;
      }
      .item summary {
        cursor: pointer;
        color: var(--muted);
        font-size: 12px;
      }
      .preview {
        white-space: pre-wrap;
        background: var(--wash);
        padding: 13px;
        border-radius: 6px;
        max-height: 42vh;
        overflow: auto;
        overflow-wrap: anywhere;
      }
      .capsule {
        display: none;
        position: fixed;
        right: 18px;
        top: 14px;
        align-items: center;
        gap: 7px;
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 2px 7px;
        font-size: 12px;
        z-index: 2;
      }
      body.focus .capsule {
        display: flex;
      }
      body.focus .top,
      body.focus aside {
        display: none;
      }
      body.focus .layout {
        height: 100dvh;
        display: block;
      }
      body.focus main {
        height: 100%;
      }
      body.focus .sheet {
        margin-top: 72px;
      }
      .notice {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--ink);
        color: white;
        border-radius: 6px;
        padding: 6px 14px;
        z-index: 5;
        pointer-events: none;
      }
      @media (max-width: 820px) {
        .layout > :is(#libraryRail, #rightRail) {
          width: 100%;
          border: 0;
        }
        body:has(#libraryRail:not([hidden]), #rightRail:not([hidden])) main {
          display: none;
        }
        .sheet {
          width: min(100% - 42px, 620px);
          margin-top: 40px;
        }
        .top {
          gap: 4px;
        }
        .long {
          display: none;
        }

        .thread {
          padding-top: 18px;
        }
        .top .with {
          padding-inline: 7px;
        }
        .block {
          font-size: 17px;
        }
        .top .divider {
          display: none;
        }
        .wordmark {
          width: 99px;
        }
        body.focus main {
          display: block;
        }
        body.focus aside {
          display: none;
        }
      }
      @media (max-width: 450px) {
        .top {
          padding: 0 7px;
        }
        .top .ib,
        .top .with {
          min-width: 27px;
          padding: 4px;
        }
        .wordmark {
          width: 87px;
        }
        .top {
          gap: 2px;
        }
        .top .right-label {
          display: none;
        }
        .top .save-state {
          position: absolute;
          top: 57px;
          right: 4px;
          z-index: 2;
          background: var(--paper, #fff);
          font-size: 11px;
        }
        .sheet {
          width: calc(100% - 38px);
        }
      }
    </style>
  </head>
  <body>
    <header class="top">
      <img class="wordmark" id="logo" alt="Inkling" /><span
        class="divider"
      ></span
      ><button
        class="with"
        id="libraryToggle"
        data-do="toggle-library"
        aria-label="文章库"
        aria-expanded="false"
        aria-controls="libraryRail"
      >
        <i data-icon="library"></i>文章库</button
      ><span class="grow"></span
      ><button
        class="with quiet save-state"
        data-do="status"
        aria-label="保存状态"
        hidden
      >
        <i class="dot"></i><span class="save-label">本页草稿</span></button
      ><button
        class="ib"
        data-do="style"
        aria-label="风格与记忆"
        title="风格与记忆"
      >
        <i data-icon="sliders"></i></button
      ><button class="with quiet" data-do="export" aria-label="导出与发布">
        <i data-icon="export"></i><span class="long">导出与发布</span></button
      ><button
        class="with"
        id="rightToggle"
        data-do="talk"
        aria-label="讨论与版本"
        title="讨论与版本"
        aria-expanded="false"
        aria-controls="rightRail"
      >
        <i data-icon="chat"></i
        ><span class="right-label">讨论与版本</span></button
      ><button
        class="ib"
        data-do="focus"
        aria-label="专注写作"
        title="专注写作"
      >
        <i data-icon="focus"></i>
      </button>
    </header>
    <div class="capsule">
      <span class="save-state" hidden
        ><i class="dot"></i> <span class="save-label"></span></span
      ><button data-do="unfocus">退出专注</button>
    </div>
    <div class="layout">
      <section id="libraryRail" hidden aria-label="文章库">
        <header>
          <button
            id="libraryBack"
            class="ib"
            data-do="library"
            aria-label="返回文章列表"
            title="返回文章列表"
            hidden
          >
            ‹
          </button>
          <h2 id="libraryHeading">文章库</h2>
          <span class="grow"></span
          ><button
            id="libraryNew"
            data-do="create"
            class="with lined"
            aria-label="新建文章"
          >
            <i data-icon="plus"></i>新建</button
          ><button
            class="ib"
            data-do="hide-library"
            aria-label="收起文章库"
            title="收起文章库"
          >
            <i data-icon="close"></i>
          </button>
        </header>
        <div class="inside" id="libraryBody"></div>
        <nav id="libraryMaterials" aria-label="写作材料"></nav>
      </section>
      <main id="paper">
        <article class="sheet" id="draftSheet">
          <div class="crumb">
            <i></i><span>个人写作</span><span>／</span><span id="genre"></span>
          </div>
          <h1
            id="title"
            contenteditable="plaintext-only"
            aria-label="文章标题"
          ></h1>
          <div id="blocks"></div>
          <div class="endmark" id="count"></div>
        </article>
        <article class="sheet" id="shelfSheet" hidden></article>
      </main>
      <aside id="rightRail" aria-label="讨论与版本">
        <header class="rail-head">
          <button id="discussionTab" data-do="discussion">讨论</button>

      // Standalone copy of the bounded text diff from apps/web/src/document-diff.ts.
      function textChanges(before, after) {
        const a = [...before],
          b = [...after];
        let prefix = 0,
          suffix = 0;
        while (
          prefix < a.length &&
          prefix < b.length &&
          a[prefix] === b[prefix]
        )
          prefix++;
        while (
          suffix < a.length - prefix &&
          suffix < b.length - prefix &&
          a[a.length - 1 - suffix] === b[b.length - 1 - suffix]
        )
          suffix++;
        const x = a.slice(prefix, a.length - suffix),
          y = b.slice(prefix, b.length - suffix),
          out = [];
        const add = (kind, text) => {
          if (!text) return;
          const last = out.at(-1);
          if (last?.kind === kind) last.text += text;
          else out.push({ kind, text });
        };
        add('same', a.slice(0, prefix).join(''));
        if (
          x.length > 0 &&
          y.length > 0 &&
          (x.length + 1) * (y.length + 1) <= 100_000
        ) {
          const table = Array.from(
            { length: x.length + 1 },
            () => new Uint32Array(y.length + 1),
          );
          for (let i = x.length - 1; i >= 0; i--)
            for (let j = y.length - 1; j >= 0; j--)
              table[i][j] =
                x[i] === y[j]
                  ? table[i + 1][j + 1] + 1
                  : Math.max(table[i + 1][j], table[i][j + 1]);
          let i = 0,
            j = 0;
          while (i < x.length || j < y.length) {
            if (i < x.length && j < y.length && x[i] === y[j]) {
              add('same', x[i++]);
              j++;
            } else if (
              i < x.length &&
              (j === y.length || table[i + 1][j] >= table[i][j + 1])
            )
              add('removed', x[i++]);
            else add('added', y[j++]);
          }
        } else {
          add('removed', x.join(''));
          add('added', y.join(''));
        }
        add('same', suffix ? a.slice(a.length - suffix).join('') : '');
        return out;
      }

      function revisionDiff(base, target) {
        const changes = [];
        function difference(label, before, after, format = '') {
          if (before === after && !format) return;
          const deltas = textChanges(before, after);
          const line = (side, sign, omit, mark) =>
            '<div class="diff-line ' +
            side +
            '"><b aria-hidden="true">' +
            sign +
            '</b><span>' +
            deltas
              .filter((d) => d.kind !== omit)
              .map((d) =>
                d.kind === 'same'
                  ? esc(d.text)
                  : '<' + mark + '>' + esc(d.text) + '</' + mark + '>',
              )
              .join('') +
            '</span></div>';
          changes.push(
            '<div class="item"><small>' +
              esc(label) +
              '</small><div class="revision-diff">' +
              (before !== after && before
                ? line('removed', '−', 'added', 'del')
                : '') +
              (before !== after && after
                ? line('added', '+', 'removed', 'ins')
                : '') +
              '</div>' +
              (format ? '<small>' + esc(format) + '</small>' : '') +
              '</div>',
          );
        }
        difference('标题', base.title, target.title);
        const oldById = new Map(base.blocks.map((b) => [b.id, b])),
          newIds = new Set(target.blocks.map((b) => b.id));
        const commonOrder = base.blocks
          .filter((b) => newIds.has(b.id))
          .map((b) => b.id);
        const order = new Map(commonOrder.map((key, index) => [key, index]));
        let commonIndex = 0;
        target.blocks.forEach((b, i) => {
          const old = oldById.get(b.id),
            notes = [];
          if (old) {
            if (order.get(b.id) !== commonIndex) notes.push('位置调整');
            commonIndex++;
            if (old.kind !== b.kind || old.bold !== b.bold)
              notes.push('段落格式已改变');
          }
          difference(
            (old ? '修改' : '新增') + '第 ' + (i + 1) + ' 段',
            old?.text || '',
            b.text,
            notes.join(' · ') || (!old && !b.text ? '新增空段落' : ''),
          );
        });
        base.blocks.forEach((b, i) => {
          if (!newIds.has(b.id))
            difference(
              '删除原第 ' + (i + 1) + ' 段',
              b.text,
              '',
              b.text ? '' : '删除空段落',
            );
        });
        return changes.length
          ? changes.join('')
          : '<p>标题、正文和格式相同。</p>';

          case 'strong': {
            const b = findBlock(toolTarget);
            if (!b) return;
            if (op === 'strong') b.bold = !b.bold;
            else {
              const kind = op === 'heading' ? 'h2' : 'ul';
              b.kind = b.kind === kind ? 'p' : kind;
            }
            changed();
            renderPaper();
            $('tool').hidden = true;
            break;
          }
          case 'question':
            reply(
              '帮我推敲文章的核心判断。',
              '如果只能留下一句话，你想让读者相信什么？可以先写下这个判断，再指出哪个条件改变后，你会改主意。',
            );
            break;
          case 'evidence': {
            const s = store.sources.find((x) => art.attached.includes(x.id));
            reply(
              '当前资料能支持哪一步判断？',
              s
                ? '你选的「' +
                    s.title +
                    '」提供了一条观察。先把原文和自己的推断分开，再决定还缺哪一次验证。'
                : '目前没有附上资料。先打开资料页，勾选一份你希望讨论的记录。',
              s ? { source: s.id, quote: s.text } : {},
            );
            break;
          }
          case 'review': {
            const b =
              findBlock(selected) ||
              art.blocks.find((b) => b.kind === 'p') ||
              art.blocks[0];
            reply(
              '审阅一下这段论证。',
              '这段里，哪一句是读者可以复查的观察？建议在它后面补上当时的条件，再写你的判断。',
              { review: b.id, quote: b.text.slice(0, 70) },
            );
            break;
          }
          case 'dismiss':
            chat().messages[Number(key)].dismissed = true;
            persist();
            renderChat();
            break;
          case 'outline':
            closePanel();
            reply(
              '帮我整理文章结构。',
              '建议用一个小节交代判断的边界，然后写下什么观察会让你重新考虑。',
              { outline: '什么情况会改变我的判断' },
            );
            break;
          case 'use-outline': {
            const m = chat().messages[Number(key)];
            if (!m.used) {
              art.blocks.push(block(m.outline, 'h2'));
              m.used = true;
              changed();
              renderPaper();
              renderChat();
            }
            break;
          }
          case 'regenerate':
            propose(chat().proposal.target);
            break;
          case 'apply': {
            const p = chat().proposal,
              b = p && findBlock(p.target);
            if (!b || p.base !== art.rev || b.text !== p.before) {
              renderProposal();
              return;
            }
            if (!p.after.trim()) {
              toast('请先填写候选文字');
              return;
            }
            b.text = p.after;
            chat().proposal = null;
            changed();
            renderPaper();
            message('已将你确认的文字写入选中的段落。');
            break;
          }
          case 'discard':
            chat().proposal = null;
            persist();
            renderChat();
            break;
          case 'history':
            versionQuery = '';
            comparison = null;
            recoveryLimit = 0;
            historyPanel();
            break;
          case 'archive-history':
            versionQuery = '';
            comparison = null;
            recoveryLimit = 0;
            renderVersions();
            break;
          case 'compare-version':
            comparison = { from: Number(key), to: 'current' };
            renderVersions();
            break;
          case 'close-comparison':
            comparison = null;
            renderVersions();
            break;
          case 'toggle-recoveries':
            if (recoveryLimit) {
              comparison = null;
              recoveryLimit = 0;
            } else recoveryLimit = 10;
            renderVersions();
            break;
          case 'older-recoveries':
            recoveryLimit += 10;
            renderVersions();
            break;
          case 'manual-save':
            manualSave();
            break;
          case 'version-settings':
            panel(
              'version-settings',
              '保存设置',
              '<label for="idleMinutes">停笔多久后保存</label><select id="idleMinutes">' +
                [5, 10]
                  .map(
                    (n) =>
                      '<option value="' +
                      n +
                      '" ' +
                      (n === idleMinutes() ? 'selected' : '') +
                      '>' +
                      n +
                      ' 分钟</option>',
                  )
                  .join('') +
                '</select><p>标题或结构、格式变化，或正文累计增删 20 个非空白字符，停笔后会留一份备份。等待期间重新起笔，本轮改为手动存版。</p><p>每 30 分钟备份有改动的稿件。每篇保留最近 10 份自动副本，命名后可长期保留。</p>' +
                btn('status', '查看草稿保存状态'),
            );
            break;
          case 'renamever': {
            const rev = Number(key);
            const previous = art.versions.find((v) => v.rev === rev);
            panel(
              'name',
              '命名稿次',
              '<label for="versionname">稿次名称</label><input id="versionname" maxlength="80" placeholder="例如：补完恢复实验" value="' +
                esc(
                  previous && versionKind(art, previous) !== 'recovery'
                    ? previous.label
                    : '',
                ) +
                '">' +
                btn('savename', '保存名称', rev),
            );
            break;
          }
          case 'savename': {
            const name = $('versionname').value.trim();
            if (!name) {
              $('versionname').focus();
              return;
            }
            const rev = Number(key),
              v = art.versions.find((v) => v.rev === rev);
            if (v) {
              if (v.rev === art.published) v.wasPublished = true;
              v.label = name;
              v.kind = 'named';
            }
            persist();
            historyPanel();
            break;
          }
          case 'restorever':
            panel(
              'restore',
              '恢复「' +
                versionId(art.versions.find((v) => v.rev === Number(key))) +
                '」？',
              '<p>当前稿会保留为恢复前稿。以下是恢复将带来的改动。</p>' +
                revisionDiff(
                  art,
                  art.versions.find((v) => v.rev === Number(key)),
                ) +
                btn('confirmrestore', '恢复为新版本', key, 'primary') +
                btn('history', '返回'),
            );
            break;
          case 'confirmrestore': {
            const v = art.versions.find((v) => v.rev === Number(key));
            if (!v) {
              historyPanel();
              toast('这份自动备份已轮换，请重新选择');
              break;
            }
            keepSnapshot(art, '恢复前稿', 'milestone');
            art.title = v.title;
            art.blocks = copy(v.blocks);
            selected = null;
            changed();
            keepSnapshot(art, '恢复自「' + versionId(v) + '」', 'milestone');
            delete art.writing;
            scheduleCheckpoints();
            writingFeedback('版本已恢复');
            persist();
            comparison = null;
            renderPaper();
            renderChat();
            historyPanel();
            break;
          }
          case 'style':
            stylePanel();
            break;
          case 'savestyle':
            art.style = $('style').value;
            store.rules = $('rules').value;
            persist();
            meta();
            closePanel();
            break;
          case 'remember':
            store.memories.push(key);
            persist();
            stylePanel();
            break;
          case 'forget':
            store.memories.splice(Number(key), 1);
            persist();
            stylePanel();
            break;
          case 'export':
            exportPanel();
            break;
          case 'download':
            download(
              (art.title || '稿件') + '.md',
              markdown(),
              'text/markdown',
            );
            break;
          case 'publish':
            if ($('confirm').checked && art.rev === Number(key)) {
              keepSnapshot(art, '发表稿', 'published');
              art.published = art.rev;
              delete art.writing;
              scheduleCheckpoints();
              persist();
              if (libraryOpen && tab === '文章') library(tab);
              exportPanel();
            }
            break;
          case 'status':
            statusPanel();
            break;
          case 'rescue':
            download(
              'inkling-demo.json',
              JSON.stringify(snapshot(art, '救援稿'), null, 2),
              'application/json',
            );
            break;
          case 'chats':
            chatHistory();
            break;
          case 'newchat':
            stop();
            art.chats.unshift(discussion());
            $('prompt').value = '';
            persist();
            renderChat();
            $('prompt').focus();
            break;
          case 'openchat':
            stop();
            {
              const i = art.chats.findIndex((c) => c.id === key);
              art.chats.unshift(...art.chats.splice(i, 1));
            }
            closePanel();
            $('prompt').value = '';
            persist();
            showTalk();
            renderChat();
            break;
          case 'focus':
            closePanel();
            document.body.classList.add('focus');
            syncRails();
            break;
          case 'unfocus':
            document.body.classList.remove('focus');
            syncRails();
            break;
          case 'talk':
            if (!$('rightRail').hidden) hideRight();
            else openRight(rightView);
            break;
          case 'back':
            hideRight();
            break;
        }
      });
      document.addEventListener('keydown', (e) => {
        if (
          (e.metaKey || e.ctrlKey) &&
          e.key.toLowerCase() === 's' &&
          !e.altKey &&
          !e.shiftKey
        ) {
          e.preventDefault();
          if (!e.isComposing && !composing && !$('panel').open) manualSave();
          return;
        }
        if (
          e.key === 'Escape' &&
          document.querySelector('.library-popup:popover-open')
        )
          return;
        if (e.key === 'Escape' && !$('panel').open) {
          if (document.body.classList.contains('focus')) {
            document.body.classList.remove('focus');
            syncRails();
          } else if (
            !$('libraryRail').hidden &&
            ($('rightRail').hidden || lastRail === 'left')
          )
            hideLibrary();
          else if (!$('rightRail').hidden) hideRight();
          $('tool').hidden = true;
        }
      });
      addEventListener('pagehide', persist);
      let composing = false;
      document.addEventListener('compositionstart', () => {
        composing = true;
      });
      document.addEventListener('compositionend', () => {
        composing = false;
      });
      for (const article of store.articles) {
        for (const v of article.versions) assignVersionId(article, v);
        if (
          article.status === 'active' &&
          !article.writing &&
          !sameContent(article, article.versions.at(-1))
        ) {
          const now = Date.now();
          article.writing = {
            lastEdit: now,
            backupDue: now + backupInterval,
            waitForManual: false,
          };
        }
      }
      scheduleCheckpoints();
      syncRails();
      renderPaper();
      renderChat();
      persist();
    </script>
  </body>
</html>
