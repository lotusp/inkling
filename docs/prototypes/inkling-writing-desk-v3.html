<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Inkling · 写作台</title>
    <style>
      :root {
        --ink: #242e27;
        --muted: #606d62;
        --line: #dde2d8;
        --green: #345c48;
        --wash: #eef2ea;
        --paper: #fffefa;
        --serif: 'Songti SC', 'Noto Serif CJK SC', 'STSong', Georgia, serif;
        --ui:
          -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei',
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        color: var(--ink);
        background: var(--paper);
        font: 14px/1.6 var(--ui);
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
        border: 0;
        background: transparent;
        border-radius: 6px;
        padding: 5px 9px;
      }
      button:hover {
        background: var(--wash);
      }
      button:disabled {
        opacity: 0.44;
        cursor: default;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      textarea:focus-visible,
      [contenteditable]:focus-visible,
      select:focus-visible {
        outline: 2px solid #789982;
        outline-offset: 2px;
      }
      input,
      textarea,
      select {
        max-width: 100%;
        accent-color: var(--green);
      }
      [hidden] {
        display: none !important;
      }
      .row,
      header,
      .actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .grow {
        flex: 1;
      }
      .muted,
      small {
        color: var(--muted);
      }
      .icon {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.65;
        stroke-linecap: round;
        stroke-linejoin: round;
        vertical-align: -3px;
      }
      .ib {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 32px;
        min-height: 32px;
      }
      .with {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .primary {
        background: var(--green);
        color: white;
      }
      .primary:hover {
        background: #264937;
      }
      .quiet {
        color: var(--muted);
      }
      .lined {
        border: 1px solid var(--line);
      }
      .active,
      .pill {
        background: var(--wash);
        color: var(--green);
      }
      .pill {
        border-radius: 6px;
        padding: 2px 7px;
        font-size: 12px;
      }
      .actions {
        flex-wrap: wrap;
      }
      .wordmark {
        width: 81px;
        height: 24px;
        object-fit: contain;
      }
      .top {
        height: 50px;
        padding: 0 clamp(12px, 2.2vw, 36px);
        border-bottom: 1px solid var(--line);
        background: #fdfdf9;
        gap: 12px;
      }
      .top .divider {
        height: 17px;
        border-left: 1px solid var(--line);
      }
      .top button {
        font-size: 13px;
      }
      .dot {
        display: inline-block;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #63846d;
      }
      .dot.pending {
        background: #a47635;
      }
      .layout {
        height: calc(100dvh - 50px);
        display: grid;
        grid-template-columns: minmax(0, 1fr) clamp(335px, 31vw, 465px);
      }
      main {
        overflow: auto;
        scrollbar-gutter: stable;
      }
      .sheet {
        width: min(100% - 80px, 690px);
        margin: clamp(42px, 8vh, 96px) auto 25vh;
      }
      .crumb {
        color: var(--muted);
        font-size: 12px;
        display: flex;
        gap: 11px;
        align-items: center;
      }
      .crumb i {
        display: block;
        width: 22px;
        height: 1px;
        background: #879a86;
      }
      h1 {
        font: 600 clamp(29px, 3vw, 44px)/1.35 var(--serif);
        letter-spacing: -0.045em;
        margin: 19px 0 36px;
        overflow-wrap: anywhere;
      }
      h1:empty:before {
        content: '文章标题';
        color: var(--muted);
      }
      .block {
        position: relative;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font: 18px/1.98 var(--serif);
        margin: 0 0 19px;
        min-height: 1.9em;
      }
      .block:focus,
      h1:focus {
        outline: none;
      }
      .block.h2 {
        font-size: 24px;
        line-height: 1.5;
        font-weight: 650;
        margin: 36px 0 15px;
      }
      .block.quote {
        color: var(--green);
        border-left: 2px solid #78917b;
        padding: 2px 0 2px 18px;
        margin: 26px 0;
      }
      .block.ul {
        padding-left: 1.2em;
      }
      .block.ul:before {
        content: '•';
        position: absolute;
        left: 0.2em;
        color: var(--green);
      }
      .block.strong {
        font-weight: 700;
      }
      .block.marked:after {
        content: '';
        position: absolute;
        left: -13px;
        top: 0.4em;
        bottom: 0.4em;
        border-left: 2px solid #78917b;
      }
      .endmark {
        color: #728576;
        font-size: 12px;
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 35px;
      }
      .endmark:before {
        content: '';
        width: 34px;
        border-top: 1px solid var(--line);
      }
      aside {
        min-width: 0;
        display: flex;
        flex-direction: column;
        border-left: 1px solid var(--line);
        background: #f4f6f0;
      }
      .chat-head {
        min-height: 57px;
        padding: 0 18px;
        border-bottom: 1px solid var(--line);
      }
      .chat-head h2 {
        font-size: 15px;
        margin: 0;
      }
      .chat-head small {
        font-size: 11px;
      }
      .glyph {
        font:
          italic 27px Georgia,
          serif;
        color: var(--green);
        margin-right: 2px;
      }
      .thread {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 25px clamp(16px, 2vw, 30px);
      }
      .msg {
        margin-bottom: 24px;
      }
      .by {
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: var(--green);
        margin-bottom: 7px;
      }
      .msg p {
        margin: 0;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .msg.user {
        margin-left: 20px;
        background: #e6ebe1;
        padding: 12px 15px;
        border-radius: 10px;
      }
      .msg.user .by {
        color: var(--muted);
      }
      .msg button,
      .card button {
        font-size: 12px;
      }
      .text-btn {
        color: var(--green);
        padding: 3px 0;
        margin-right: 11px;
      }
      .cite {
        border-left: 2px solid #97aa94;
        color: var(--muted);
        padding: 2px 9px !important;
        margin-top: 10px !important;
      }
      .compose {
        padding: 12px clamp(12px, 1.55vw, 24px) 18px;
      }
      .quick {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
        margin-bottom: 9px;
      }
      .quick button {
        border: 1px solid #d7ded1;
        color: #4d6353;
        font-size: 12px;
        padding: 3px 8px;
      }
      .composer {
        background: #fffefa;
        border: 1px solid #cbd4c6;
        border-radius: 10px;
        padding: 10px 12px;
      }
      .composer textarea {
        width: 100%;
        resize: vertical;
        min-height: 46px;
        max-height: 120px;
        border: 0;
        background: transparent;
        margin: 7px 0 0;
      }
      .composer textarea:focus {
        outline: none;
      }
      .composer:focus-within {
        border-color: #759078;
      }
      .context {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
      }
      .context button,
      .composer small {
        font-size: 11px;
      }
      .send {
        background: var(--green);
        color: #fff;
        width: 30px;
        height: 30px;
        padding: 0;
      }
      .send:hover {
        background: #254330;
      }
      .card {
        border: 1px solid #cdd8c8;
        border-radius: 10px;
        background: var(--paper);
        padding: 13px;
        margin: 12px 0;
      }
      .card strong,
      .card small {
        display: block;
      }
      .card del {
        display: block;
        color: var(--muted);
        margin: 8px 0;
        font-size: 13px;
      }
      .card textarea {
        width: 100%;
        min-height: 100px;
        resize: vertical;
      }
      .card .actions {
        margin-top: 9px;
      }
      .warn {
        color: #865f27;
      }
      .tool {
        position: fixed;
        z-index: 3;
        background: var(--ink);
        color: white;
        border-radius: 7px;
        box-shadow: 0 4px 20px #15251a25;
        padding: 3px;
        display: flex;
        max-width: calc(100vw - 12px);
        gap: 1px;
      }
      .tool button {
        font-size: 12px;
        color: white;
        padding: 5px 7px;
      }
      .tool button:hover {
        background: #435549;
      }
      dialog {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 0;
        color: var(--ink);
        background: var(--paper);
        width: min(460px, calc(100% - 28px));
        max-height: 84dvh;
        box-shadow: 0 20px 80px #1c2b1f24;
      }
      dialog::backdrop {
        background: #26312338;
      }
      dialog.drawer {
        height: 100dvh;
        max-height: 100dvh;
        width: min(390px, 94vw);
        margin: 0;
        border-radius: 0;
        border-width: 0 1px 0 0;
      }
      dialog.right {
        margin-left: auto;
        border-width: 0 0 0 1px;
      }
      dialog header {
        position: sticky;
        top: 0;
        background: var(--paper);
        z-index: 1;
        padding: 14px 18px;
        border-bottom: 1px solid var(--line);
      }
      dialog h2 {
        font: 600 20px var(--serif);
        margin: 0;
      }
      .inside {
        padding: 18px;
      }
      .inside h3 {
        font-size: 14px;
        margin: 18px 0 6px;
      }
      .inside input:not([type='checkbox']),
      .inside textarea,
      .inside select,
      .card textarea {
        padding: 7px 9px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: white;
      }
      .inside input:not([type='checkbox']),
      .inside textarea {
        width: 100%;
      }
      .inside textarea {
        min-height: 85px;
      }
      .inside label {
        display: block;
        margin: 10px 0 5px;
      }
      .tabs {
        display: flex;
        gap: 3px;
        border-bottom: 1px solid var(--line);
        padding-bottom: 10px;
        margin-bottom: 14px;
      }
      .item {
        padding: 13px 0;
        border-bottom: 1px solid var(--line);
        overflow-wrap: anywhere;
      }
      .item p {
        margin: 3px 0;
      }
      .item .row button:first-child {
        text-align: left;
      }
      .item details {
        margin-top: 4px;
      }
      .item summary {
        cursor: pointer;
        color: var(--muted);
        font-size: 12px;
      }
      .preview {
        white-space: pre-wrap;
        background: var(--wash);
        padding: 13px;
        border-radius: 6px;
        max-height: 42vh;
        overflow: auto;
        overflow-wrap: anywhere;
      }
      .capsule {
        display: none;
        position: fixed;
        right: 18px;
        top: 14px;
        align-items: center;
        gap: 7px;
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 2px 7px;
        font-size: 12px;
        z-index: 2;
      }
      body.focus .capsule {
        display: flex;
      }
      body.focus .top,
      body.focus aside {
        display: none;
      }
      body.focus .layout {
        height: 100dvh;
        display: block;
      }
      body.focus main {
        height: 100%;
      }
      body.focus .sheet {
        margin-top: 72px;
      }
      .mobile {
        display: none;
      }
      .notice {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--ink);
        color: white;
        border-radius: 6px;
        padding: 6px 14px;
        z-index: 5;
        pointer-events: none;
      }
      @media (max-width: 820px) {
        .mobile {
          display: inline-flex;
        }
        .layout {
          display: block;
        }
        main {
          height: 100%;
        }
        aside {
          display: none;
        }
        body.talking aside {
          display: flex;
          height: 100%;
          border-left: 0;
        }
        body.talking main {
          display: none;
        }
        .sheet {
          width: min(100% - 42px, 620px);
          margin-top: 40px;
        }
        .top {
          gap: 4px;
        }
        .long {
          display: none;
        }
        .chat-head {
          min-height: 48px;
        }
        .thread {
          padding-top: 18px;
        }
        .top .with {
          padding-inline: 7px;
        }
        .block {
          font-size: 17px;
        }
        .top .divider {
          display: none;
        }
        .wordmark {
          width: 66px;
        }
        body.focus main {
          display: block;
        }
        body.focus aside {
          display: none;
        }
      }
      @media (max-width: 450px) {
        .top {
          padding: 0 7px;
        }
        .top .ib,
        .top .with {
          min-width: 27px;
          padding: 4px;
        }
        .wordmark {
          width: 59px;
        }
        .top .save-label {
          display: none;
        }
        .sheet {
          width: calc(100% - 38px);
        }
      }
    </style>
  </head>
  <body>
    <header class="top">
      <img class="wordmark" id="logo" alt="Inkling" /><span
        class="divider"
      ></span
      ><button class="with" data-do="library" aria-label="文章库">
        <i data-icon="library"></i>文章库</button
      ><span class="grow"></span
      ><button class="with quiet" data-do="status" aria-label="保存状态">
        <i class="dot"></i><span class="save-label">本页草稿</span></button
      ><button
        class="ib"
        data-do="history"
        aria-label="版本历史"
        title="版本历史"
      >
        <i data-icon="clock"></i></button
      ><button
        class="ib"
        data-do="style"
        aria-label="风格与记忆"
        title="风格与记忆"
      >
        <i data-icon="sliders"></i></button
      ><button class="with quiet" data-do="export" aria-label="导出与发布">
        <i data-icon="export"></i><span class="long">导出与发布</span></button
      ><button class="ib mobile" data-do="talk" aria-label="切换讨论">
        <i data-icon="chat"></i></button
      ><button
        class="ib"
        data-do="focus"
        aria-label="专注写作"
        title="专注写作"
      >
        <i data-icon="focus"></i>
      </button>
    </header>
    <div class="capsule">
      <i class="dot"></i><span class="save-label">本页草稿</span
      ><button data-do="unfocus">退出专注</button>
    </div>
    <div class="layout">
      <main id="paper">
        <article class="sheet">
          <div class="crumb">
            <i></i><span>个人写作</span><span>／</span><span id="genre"></span>
          </div>
          <h1
            id="title"
            contenteditable="plaintext-only"
            aria-label="文章标题"
          ></h1>
          <div id="blocks"></div>
          <div class="endmark" id="count"></div>
        </article>
      </main>
      <aside aria-label="文章讨论">
        <header class="chat-head">
          <span class="glyph" aria-hidden="true">ℐ</span>
          <h2>讨论</h2>
          <small>示例对话</small><span class="grow"></span
          ><button
            class="ib"
            data-do="chats"
            aria-label="讨论历史"
            title="讨论历史"
          >
            <i data-icon="clock"></i></button
          ><button
            class="ib"
            data-do="newchat"
            aria-label="新讨论"
            title="新讨论"
          >
            <i data-icon="plus"></i></button
          ><button class="ib mobile" data-do="back" aria-label="返回正文">
            <i data-icon="close"></i>
          </button>
        </header>
        <section id="thread" class="thread" aria-label="当前讨论"></section>
        <div class="compose">
          <div class="quick">
            <button data-do="question">推敲判断</button
            ><button data-do="evidence">查找依据</button
            ><button data-do="review">审阅文章</button
            ><button data-do="rewrite-selected" id="rewriteSelected" hidden>
              改写这段
            </button>
          </div>
          <form class="composer" id="compose">
            <div id="context" class="context"></div>
            <textarea
              id="prompt"
              aria-label="讨论问题"
              placeholder="写下想推敲的问题…"
              rows="2"
            ></textarea>
            <div class="row">
              <button
                class="quiet"
                type="button"
                data-do="style"
                id="stylechip"
              ></button
              ><span class="grow"></span
              ><button class="send" id="send" aria-label="发送">
                <i data-icon="arrow"></i>
              </button>
            </div>
          </form>
        </div>
      </aside>
    </div>
    <nav id="tool" class="tool" hidden aria-label="段落操作">
      <button data-do="strong">加粗</button
      ><button data-do="heading">小标题</button
      ><button data-do="list">列表</button
      ><button data-do="discuss">讨论这段</button
      ><button data-do="rewrite">改写这段</button>
    </nav>
    <dialog id="panel">
      <header>
        <h2 id="paneltitle"></h2>
        <span class="grow"></span
        ><button class="ib" data-do="close" aria-label="关闭面板">
          <i data-icon="close"></i>
        </button>
      </header>
      <div class="inside" id="inside"></div>
    </dialog>
    <div class="notice" id="notice" role="status" hidden></div>
    <script>
      'use strict';
      const $ = (id) => document.getElementById(id);
      const esc = (value) =>
        String(value ?? '').replace(
          /[&<>"']/g,
          (c) =>
            ({
              '&': '&amp;',
              '<': '&lt;',
              '>': '&gt;',
              '"': '&quot;',
              "'": '&#39;',
            })[c],
        );
      const id = () => crypto.randomUUID(),
        copy = (x) => JSON.parse(JSON.stringify(x));
      const icons = {
        library: 'M3 4h5v16H3z M11 4h4v16h-4z M17 5l3-1 3 15-3 1z',
        clock: 'M3 5v5h5 M4 9a8 8 0 1 1 0 7 M12 7v5l4 2',
        sliders: 'M3 7h4m5 0h9 M3 17h10m5 0h3 M10 4v6m6 4v6',
        export: 'M12 15V3m-4 4 4-4 4 4 M5 12v8h14v-8',
        chat: 'M4 4h16v12H9l-5 4z',
        focus: 'M3 8V3h5m8 0h5v5m0 8v5h-5m-8 0H3v-5',
        plus: 'M12 4v16M4 12h16',
        close: 'M6 6l12 12M18 6 6 18',
        arrow: 'M12 19V5m-6 6 6-6 6 6',
      };
      document.querySelectorAll('[data-icon]').forEach((el) => {
        el.outerHTML =
          '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="' +
          icons[el.dataset.icon] +
          '"/></svg>';

        t.style.top = Math.max(4, r.top - t.offsetHeight - 6) + 'px';
        t.style.left =
          Math.max(5, Math.min(innerWidth - t.offsetWidth - 5, r.left)) + 'px';
      }
      document.addEventListener('selectionchange', selectionTool);
      $('paper').addEventListener('scroll', () => {
        $('tool').hidden = true;
      });
      $('tool').onmousedown = (e) => e.preventDefault();
      $('compose').onsubmit = (e) => {
        e.preventDefault();
        if (typingTimer) {
          stop();
          return;
        }
        const value = $('prompt').value.trim();
        if (!value) return;
        $('prompt').value = '';
        const b = findBlock(selected);
        reply(
          value,
          b
            ? '你选中的这段写到「' +
                b.text.slice(0, 24) +
                '」。其中哪些是你亲眼观察到的，哪些是事后推测的？把两者分别写一句试试。'
            : '读完「' +
                (a().title || '未命名文章') +
                '」，我想先问：你希望读者记住哪一次具体经历？先写下当时能观察到的变化，再推敲结论。',
        );
      };
      $('prompt').onkeydown = (e) => {
        if (
          e.key === 'Enter' &&
          !e.shiftKey &&
          !e.isComposing &&
          e.keyCode !== 229
        ) {
          e.preventDefault();
          $('compose').requestSubmit();
        }
      };
      function markdown() {
        return (
          '# ' +
          a().title +
          '\n\n' +
          a()
            .blocks.map(
              (b) =>
                (b.kind === 'h2'
                  ? '## '
                  : b.kind === 'quote'
                    ? '> '
                    : b.kind === 'ul'
                      ? '- '
                      : '') + (b.bold ? '**' + b.text + '**' : b.text),
            )
            .join('\n\n')
        );
      }
      function download(filename, data, type) {
        const url = URL.createObjectURL(new Blob([data], { type })),
          link = document.createElement('a');
        link.href = url;
        link.download = filename;
        link.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }
      function closePanel() {
        if ($('panel').open) $('panel').close();
        panelName = '';
      }
      function panel(name, title, html, side = '') {
        panelName = name;
        const d = $('panel');
        d.className = side ? 'drawer ' + side : '';
        $('paneltitle').textContent = title;
        $('inside').innerHTML = html;
        $('tool').hidden = true;
        if (!d.open) d.showModal();
        d.scrollTop = 0;
      }
      $('panel').addEventListener('click', (e) => {
        if (e.target !== $('panel')) return;
        const r = $('panel').getBoundingClientRect();
        if (
          e.clientX < r.left ||
          e.clientX > r.right ||
          e.clientY < r.top ||
          e.clientY > r.bottom
        )
          closePanel();
      });
      function library(next = tab, highlight = '') {
        tab = next;
        const tabs = ['文章', '灵感', '资料', '大纲'];
        let html =
          '<nav class="tabs">' +
          tabs
            .map((t) => btn('tab', t, t, t === tab ? 'active' : ''))
            .join('') +
          '</nav>';
        if (tab === '文章') {
          html +=
            '<div class="row"><select id="folder" aria-label="文章状态">' +
            [
              ['active', '草稿'],
              ['archived', '已归档'],
              ['trash', '回收站'],
            ]
              .map(
                ([v, t]) =>
                  '<option value="' +
                  v +
                  '" ' +
                  (folder === v ? 'selected' : '') +
                  '>' +
                  t +
                  '</option>',
              )
              .join('') +
            '</select><span class="grow"></span>' +
            btn('create', '＋ 新文章') +
            '</div>';
          const list = store.articles.filter((x) => x.status === folder);
          html +=
            list
              .map(
                (x) =>
                  '<div class="item"><div class="row">' +
                  (folder === 'active'
                    ? btn(
                        'open',
                        x.title || '未命名文章',
                        x.id,
                        x === a() ? 'active' : '',
                      )
                    : esc(x.title || '未命名文章')) +
                  '</div><details><summary>文章操作</summary><div class="actions">' +
                  (folder === 'trash'
                    ? btn('recover', '恢复文章', x.id)
                    : btn(
                        'archive',
                        folder === 'active' ? '归档' : '取消归档',
                        x.id,
                      ) + btn('trash', '移入回收站', x.id)) +
                  '</div></details></div>',
              )
              .join('') || '<p class="muted">这里还没有文章。</p>';
        } else if (tab === '灵感') {
          html +=
            '<label for="idea">随手记</label><textarea id="idea" placeholder="记下还没展开的想法"></textarea>' +
            btn('save-idea', '保存灵感') +
            store.notes
              .map(
                (n, i) =>
                  '<div class="item"><p>' +
                  esc(n) +
                  '</p>' +
                  btn('insert', '插入正文', i, 'text-btn') +
                  '</div>',
              )
              .join('');
        } else if (tab === '资料') {
          html +=
            store.sources
              .map(
                (s) =>
                  '<div class="item" id="src-' +
                  s.id +
                  '"><label><input type="checkbox" data-src="' +
                  s.id +
                  '" ' +
                  (a().attached.includes(s.id) ? 'checked' : '') +
                  '> ' +
                  esc(s.title) +
                  '</label><small>' +
                  esc(s.text) +
                  '</small></div>',
              )
              .join('') +
            '<details class="item"><summary>添加资料</summary><label for="source-title">资料标题</label><input id="source-title"><label for="excerpt">摘记</label><textarea id="excerpt"></textarea>' +
            btn('addsource', '保存资料') +
            '</details>';
        } else {
          const headings = a().blocks.filter((b) => b.kind === 'h2');
          html +=
            headings
              .map(
                (b) =>
                  '<div class="item">' +
                  btn('locate', b.text, b.id, 'text-btn') +
                  '</div>',
              )
              .join('') || '<p class="muted">文章还没有小标题。</p>';
          html += btn('outline', '和 Inkling 整理结构', '', 'primary');
        }
        panel('library', '写作资料库', html, 'left');
        if (highlight) {
          const el = $('src-' + highlight);
          if (el) {
            el.classList.add('active');
            el.scrollIntoView({ block: 'nearest' });
          }
        }
      }
      function switchTo(x) {
        stop();
        finishVersion();
        store.active = x.id;
        selected = null;
        toolTarget = null;
        compareIds = [];
        $('prompt').value = '';
        $('tool').hidden = true;
        closePanel();
        renderPaper();
        renderChat();
        $('paper').scrollTop = 0;
        persist();
      }
      function articleAction(x, action) {
        if (action === 'recover') {
          x.status = x.beforeTrash || 'active';
          delete x.beforeTrash;
        } else if (action === 'trash') {
          x.beforeTrash = x.status;
          x.status = 'trash';
        } else x.status = x.status === 'archived' ? 'active' : 'archived';
        if (x === a() && x.status !== 'active') {
          let next = store.articles.find((other) => other.status === 'active');
          if (!next) {
            next = article('未命名文章', [block()]);
            store.articles.push(next);
          }
          switchTo(next);
        }
        persist();
        library('文章');
      }
      function historyPanel() {
        finishVersion();
        const versions = a().versions;
        let html = versions
          .slice()
          .reverse()
          .map(
            (v) =>
              '<div class="item"><label><input type="checkbox" data-ver="' +
              v.rev +
              '" ' +
              (compareIds.includes(v.rev) ? 'checked' : '') +
              '> v' +
              v.rev +
              ' · ' +
              esc(v.label) +
              '</label><details><summary>版本操作</summary>' +
              btn('renamever', '命名', v.rev) +
              (v.rev !== a().rev ? btn('restorever', '恢复此版', v.rev) : '') +
              '</details></div>',
          )
          .join('');
        if (compareIds.length === 2) {
          html +=
            '<h3>版本对照</h3>' +
            compareIds
              .map((r) => {
                const v = versions.find((x) => x.rev === r);
                return (
                  '<small>v' +
                  r +
                  '</small><div class="preview">' +
                  esc([v.title, ...v.blocks.map((b) => b.text)].join('\n\n')) +
                  '</div>'
                );
              })
              .join('');
        }
        panel('history', '版本历史', html, 'right');
      }
      function stylePanel() {
        const memo = '记录技术取舍时，把适用条件和反例一起写下。';
        panel(
          'style',
          '风格与记忆',
          '<label for="style">本篇文类</label><select id="style">' +
            ['技术随笔', '技术复盘', '教程', '观点']
              .map(
                (s) =>
                  '<option ' +
                  (s === a().style ? 'selected' : '') +
                  '>' +
                  s +
                  '</option>',
              )
              .join('') +
            '</select><label for="rules">我的表达偏好</label><textarea id="rules">' +
            esc(store.rules) +
            '</textarea>' +
            btn('savestyle', '保存风格', '', 'primary') +
            '<h3>已确认的记忆</h3>' +
            (store.memories
              .map(
                (m, i) =>
                  '<div class="item">' +
                  esc(m) +
                  ' ' +
                  btn('forget', '撤回', i, 'text-btn') +
                  '</div>',
              )
              .join('') || '<small>还没有已确认的记忆。</small>') +
            (store.memories.includes(memo)
              ? ''
              : '<h3>候选经验</h3><p>' +
                memo +
                '</p>' +
                btn('remember', '确认保存', memo)),
        );
      }
      function exportPanel() {
        finishVersion();
        const x = a();
        panel(
          'export',
          '导出与发布',
          '<p>个人博客 · 模拟发布</p><div class="preview">' +
            esc(markdown()) +
            '</div><p>' +
            btn('download', '下载 Markdown') +
            '</p>' +
            (x.published
              ? '<p>已模拟发布 v' +
                x.published +
                (x.published !== x.rev ? ' · 本地有新修改' : '') +
                '</p>'
              : '') +
            '<label><input id="confirm" type="checkbox"> 我已检查 v' +
            x.rev +
            ' 的稿件</label><button class="primary" id="publish" data-do="publish" data-key="' +
            x.rev +
            '" disabled>模拟' +
            (x.published ? '更新' : '发布') +
            '</button>',
        );
      }
      function statusPanel() {
        panel(
          'status',
          '工作台状态',
          '<div class="item">稿件保存 · ' +
            (storageOk ? '当前浏览器' : '仅当前页') +
            '</div><div class="item">工作空间 · 独立交互原型</div><div class="item">模型与发布 · 本地示例</div><p>' +
            btn('rescue', '下载当前稿件 JSON') +
            '</p>',
        );
      }
      function chatHistory() {
        panel(
          'chats',
          '讨论历史',
          a()
            .chats.map(
              (c) =>
                '<div class="item">' +
                btn(
                  'openchat',
                  c.messages.find((m) => m.who === 'user')?.text || '新讨论',
                  c.id,
                  c === chat() ? 'active' : '',
                ) +
                '</div>',
            )
            .join(''),
          'right',
        );
      }
      document.addEventListener('change', (e) => {
        const el = e.target;
        if (el.id === 'folder') {
          folder = el.value;
          library();
        } else if (el.dataset.src) {
          const key = el.dataset.src;
          a().attached = el.checked
            ? [...new Set([...a().attached, key])]
            : a().attached.filter((s) => s !== key);
          persist();
          meta();
        } else if (el.dataset.ver) {
          const r = Number(el.dataset.ver);
          compareIds = el.checked
            ? [...compareIds.slice(-1), r]
            : compareIds.filter((v) => v !== r);
          historyPanel();
        } else if (el.id === 'confirm') $('publish').disabled = !el.checked;
      });
      document.addEventListener('click', (e) => {
        const trigger = e.target.closest('[data-do]');
        if (!trigger) return;
        const key = trigger.dataset.key,
          op = trigger.dataset.do,
          art = a();
        switch (op) {
          case 'library':
            library('文章');
            break;
          case 'tab':
            library(key);
            break;
          case 'close':
            closePanel();
            break;
          case 'sources':
          case 'source':
            library('资料', key);
            break;
          case 'create': {
            const x = article('未命名文章', [block()]);
            store.articles.unshift(x);
            switchTo(x);
            $('title').focus();
            break;
          }
          case 'open':
            switchTo(store.articles.find((x) => x.id === key));
            break;
          case 'archive':
          case 'recover':
            articleAction(
              store.articles.find((x) => x.id === key),
              op,
            );
            break;
          case 'trash':
            panel(
              'confirm',
              '移入回收站？',
              '<p>' +
                esc(store.articles.find((x) => x.id === key).title) +
                ' 可以从回收站恢复。</p>' +
                btn('confirmtrash', '移入回收站', key, 'primary') +
                btn('library', '取消'),
            );
            break;
          case 'confirmtrash':
            articleAction(
              store.articles.find((x) => x.id === key),
              'trash',
            );
            break;
          case 'save-idea': {
            const v = $('idea').value.trim();
            if (v) {
              store.notes.unshift(v);
              persist();
              library('灵感');
            }
            break;
          }
          case 'insert':
            art.blocks.push(block(store.notes[Number(key)]));
            changed('插入灵感');
            closePanel();
            renderPaper();
            locate(art.blocks.at(-1).id);
            break;
          case 'note':
            store.notes.unshift(chat().messages[Number(key)].text);
            persist();
            toast('已存入灵感');
            break;
          case 'addsource': {
            const title = $('source-title').value.trim();
            if (!title) return;
            store.sources.push({
              id: id(),
              title,
              text: $('excerpt').value.trim(),
            });
            persist();
            library('资料');
            break;
          }
          case 'locate':
            locate(key);
            break;
          case 'unselect':
            mark(null);
            break;
          case 'discuss':
            mark(toolTarget);
            showTalk();
            getSelection().removeAllRanges();
            $('prompt').focus();
            break;
          case 'rewrite-selected':
            propose(selected);
            break;
          case 'rewrite':
            propose(toolTarget);
            getSelection().removeAllRanges();
            break;
          case 'heading':
          case 'list':
          case 'strong': {
            const b = findBlock(toolTarget);
            if (!b) return;
            if (op === 'strong') b.bold = !b.bold;
            else {
              const kind = op === 'heading' ? 'h2' : 'ul';
              b.kind = b.kind === kind ? 'p' : kind;
            }
            changed('段落格式');
            renderPaper();
            $('tool').hidden = true;
            break;
          }
          case 'question':
            reply(
              '帮我推敲文章的核心判断。',
              '如果只能留下一句话，你想让读者相信什么？可以先写下这个判断，再指出哪个条件改变后，你会改主意。',
            );
            break;
          case 'evidence': {
            const s = store.sources.find((x) => art.attached.includes(x.id));
            reply(
              '当前资料能支持哪一步判断？',
              s
                ? '你选的「' +
                    s.title +
                    '」提供了一条观察。先把原文和自己的推断分开，再决定还缺哪一次验证。'
                : '目前没有附上资料。先打开资料页，勾选一份你希望讨论的记录。',
              s ? { source: s.id, quote: s.text } : {},
            );
            break;
          }
          case 'review': {
            const b =
              findBlock(selected) ||
              art.blocks.find((b) => b.kind === 'p') ||
              art.blocks[0];
            reply(
              '审阅一下这段论证。',
              '这段里，哪一句是读者可以复查的观察？建议在它后面补上当时的条件，再写你的判断。',
              { review: b.id, quote: b.text.slice(0, 70) },
            );
            break;
          }
          case 'dismiss':
            chat().messages[Number(key)].dismissed = true;
            persist();
            renderChat();
            break;
          case 'outline':
            closePanel();
            reply(
              '帮我整理文章结构。',
              '建议用一个小节交代判断的边界，然后写下什么观察会让你重新考虑。',
              { outline: '什么情况会改变我的判断' },
            );
            break;
          case 'use-outline': {
            const m = chat().messages[Number(key)];
            if (!m.used) {
              art.blocks.push(block(m.outline, 'h2'));
              m.used = true;
              changed('采用大纲');
              renderPaper();
              renderChat();
            }
            break;
          }
          case 'regenerate':
            propose(chat().proposal.target);
            break;
          case 'apply': {
            const p = chat().proposal,
              b = p && findBlock(p.target);
            if (!b || p.base !== art.rev || b.text !== p.before) {
              renderProposal();
              return;
            }
            if (!p.after.trim()) {
              toast('请先填写候选文字');
              return;
            }
            b.text = p.after;
            chat().proposal = null;
            changed('采用段落修改');
            finishVersion('采用段落修改');
            renderPaper();
            message('已将你确认的文字写入选中的段落。');
            break;
          }
          case 'discard':
            chat().proposal = null;
            persist();
            renderChat();
            break;
          case 'history':
            compareIds = [];
            historyPanel();
            break;
          case 'renamever':
            panel(
              'name',
              '命名版本',
              '<label for="versionname">v' +
                Number(key) +
                ' 的名称</label><input id="versionname" value="' +
                esc(art.versions.find((v) => v.rev === Number(key)).label) +
                '">' +
                btn('savename', '保存名称', key),
            );
            break;
          case 'savename': {
            const v = art.versions.find((v) => v.rev === Number(key));
            if ($('versionname').value.trim())
              v.label = $('versionname').value.trim();
            persist();
            historyPanel();
            break;
          }
          case 'restorever':
            panel(
              'restore',
              '恢复 v' + Number(key) + '？',
              '<p>当前正文会保留在历史中。</p>' +
                btn('confirmrestore', '恢复为新版本', key, 'primary') +
                btn('history', '返回'),
            );
            break;
          case 'confirmrestore': {
            const v = art.versions.find((v) => v.rev === Number(key));
            art.title = v.title;
            art.blocks = copy(v.blocks);
            selected = null;
            changed();
            finishVersion('恢复自 v' + v.rev);
            renderPaper();
            renderChat();
            historyPanel();
            break;
          }
          case 'style':
            stylePanel();
            break;
          case 'savestyle':
            art.style = $('style').value;
            store.rules = $('rules').value;
            persist();
            meta();
            closePanel();
            break;
          case 'remember':
            store.memories.push(key);
            persist();
            stylePanel();
            break;
          case 'forget':
            store.memories.splice(Number(key), 1);
            persist();
            stylePanel();
            break;
          case 'export':
            exportPanel();
            break;
          case 'download':
            download(
              (art.title || '稿件') + '.md',
              markdown(),
              'text/markdown',
            );
            break;
          case 'publish':
            if ($('confirm').checked && art.rev === Number(key)) {
              art.published = art.rev;
              persist();
              exportPanel();
            }
            break;
          case 'status':
            statusPanel();
            break;
          case 'rescue':
            download(
              'inkling-demo.json',
              JSON.stringify(snapshot(art, '救援稿'), null, 2),
              'application/json',
            );
            break;
          case 'chats':
            chatHistory();
            break;
          case 'newchat':
            stop();
            art.chats.unshift(discussion());
            $('prompt').value = '';
            persist();
            renderChat();
            $('prompt').focus();
            break;
          case 'openchat':
            stop();
            {
              const i = art.chats.findIndex((c) => c.id === key);
              art.chats.unshift(...art.chats.splice(i, 1));
            }
            closePanel();
            $('prompt').value = '';
            persist();
            showTalk();
            renderChat();
            break;
          case 'focus':
            closePanel();
            document.body.classList.remove('talking');
            document.body.classList.add('focus');
            break;
          case 'unfocus':
            document.body.classList.remove('focus');
            break;
          case 'talk':
            document.body.classList.toggle('talking');
            break;
          case 'back':
            document.body.classList.remove('talking');
            break;
        }
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && !$('panel').open) {
          document.body.classList.remove('focus', 'talking');
          $('tool').hidden = true;
        }
      });
      renderPaper();
      renderChat();
      persist();
    </script>
  </body>
</html>
